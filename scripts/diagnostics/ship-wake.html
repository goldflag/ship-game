<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Ship wake regression diagnostic</title>
<style>
  html,body,#scene { margin:0; width:100%; height:100%; overflow:hidden; }
  pre { position:absolute; top:0; left:1rem; padding:1rem; color:white; background:#000c; }
</style>
<div id="scene"></div><pre id="result">Initializing the actual game renderer…</pre>
<script type="module">
  // Dev-only integration check of the trail foam the game lays on the ocean (ShipWake → FleetWakeFoam):
  // a real battle, the player's hull driven through Game.frame with a controlled clock and helm, and
  // the GPU foam atlas read back. The dispersive wake field has its own page, ocean-wake.html, and
  // wake-foam-gpu.html compares the atlas with the CPU raster. Never included in the production build.
  // ?quality=low|medium|high|ultra. Results land in window.wakeDiagnostic.
  import { Game } from '/src/game/Game.ts';
  import { GRAPHICS_PRESETS } from '/src/game/graphicsSettings.ts';
  import { WAKE_EXTENT } from '/src/game/WakeFoam.ts';
  const noop = () => {};
  const quality = new URLSearchParams(location.search).get('quality') ?? 'high';
  let error;
  const game = new Game(document.querySelector('#scene'), (GRAPHICS_PRESETS[quality] ?? GRAPHICS_PRESETS.high), {
    progress:noop, ready:noop, telemetry:noop, pause:noop, hud:noop, error:m=>{error=m;},
  });
  window.wakeGame=game;
  // Drive real Game.frame calls with a controlled clock and helm.
  game.scheduleFrame = noop;
  let command = {throttle:0,rudder:0};
  const sample = game.input.sample.bind(game.input);
  game.input.sample = () => ({...sample(),...command});
  const advance = async(seconds) => {
    game.setPaused(false);
    // Yield a task per frame so the simulation worker's replies land between frames.
    for(let i=0;i<Math.round(seconds*10);i++) { await new Promise(requestAnimationFrame); await game.frame(game.lastTime+100); }
    if(error) throw new Error(error);
  };
  /** The player's trail as painted: its tile of the GPU foam atlas, read back. */
  const field = async() => {
    const foam=game.shipWake.foam, target=foam.painter.target, size=target.width, res=size/8;
    const pixels=await game.renderer.readRenderTargetPixelsAsync(target,0,0,size,size);
    const entry=foam.entries.get(game.playerView.root);
    const tile=entry ? {slot:entry.slot,x:entry.collector.centerX,z:entry.collector.centerZ} : undefined;
    const index=(ix,iz)=>(Math.floor(tile.slot/8)*res+iz)*size+(tile.slot%8)*res+ix;
    let total=0, max=0;
    if(tile) for(let iz=0;iz<res;iz++) for(let ix=0;ix<res;ix++) { const value=pixels[index(ix,iz)]/255; total+=value; max=Math.max(max,value); }
    const at=(x,z)=>{
      if(!tile) return 0;
      const ix=Math.floor((x-tile.x)/WAKE_EXTENT*res+res/2), iz=Math.floor((z-tile.z)/WAKE_EXTENT*res+res/2);
      return ix>=0 && ix<res && iz>=0 && iz<res ? pixels[index(ix,iz)]/255 : 0;
    };
    return {pixels,total,max,at,tile,centers:foam.centers.map(center=>center.toArray())};
  };
  const pose = () => {
    const ship=game.simulation.ship, forward=[Math.sin(ship.heading),-Math.cos(ship.heading)];
    // A point `aft` metres behind the hull's centre and `across` metres to starboard.
    return {heading:ship.heading,point:(aft,across=0)=>({x:ship.x-forward[0]*aft-forward[1]*across,z:ship.z-forward[1]*aft+forward[0]*across})};
  };
  const results = {};
  const report = () => {
    window.wakeDiagnostic = {...results};
    document.querySelector('#result').textContent=JSON.stringify(results,null,2);
  };
  const capture = async() => {
    // Background tabs may have been resized to 1 px by the host. Keep this
    // renderer's diagnostic camera and canvas at a representative desktop size.
    game.renderer.setSize(1440,900);
    game.camera.aspect=1440/900;
    game.camera.updateProjectionMatrix();
    game.ocean.resize(1440,900);
    game.sky.resize(1440,900);
    game.resizePending=false;
    game.sky.update(0);
    // A zero-step update renders the ocean without advancing waves, foam or wake.
    game.ocean.update(0);
    game.pipeline.render();
    await game.renderer.backend.device.queue.onSubmittedWorkDone();
    return game.renderer.domElement.toDataURL('image/png');
  };
  try {
    game.start();
    await game.initialization;
    if(error) throw new Error(error);
    game.setInPort(true); game.setPaused(true);
    await game.prepareBattle({playerShipId:'bismarck',friendlyBots:[],enemies:[{shipId:'bismarck',aiLevel:'static'}],spawnDistance:15000,mapId:'north-atlantic',windSpeed:6,timeHours:12});
    game.setInPort(false); game.setPaused(true); game.rig.releasePointer();
    await advance(1);
    results.stationaryClean=(await field()).max===0;
    command={throttle:1,rudder:0};
    await advance(60);
    const straight=await field(), cruise=pose();
    results.speed=game.simulation.ship.speed;
    const point=cruise.point(262); // about 150 m aft of the stern
    results.trailFoam=straight.at(point.x,point.z);
    // Energy must clear the material's dissolve threshold; merely nonzero
    // foam can still be visually absent in the actual shaded scene.
    results.visibleTrail=results.trailFoam>0.35;
    const widthAt=(aft)=>{
      let width=0;
      for(let across=-50;across<=50;across+=2) { const p=cruise.point(aft,across); if(straight.at(p.x,p.z)>0.2) width+=2; }
      return width;
    };
    results.freshWidth=widthAt(150);
    results.olderWidth=widthAt(300);
    results.wakeSpreads=results.olderWidth>results.freshWidth;
    game.rig.distance=650;
    game.rig.elevation=0.65;
    game.rig.update(game.simulation.ship,game.ship.position.y,0,true);
    window.wakeStraightImage=await capture();
    game.setPaused(true);
    await game.frame(game.lastTime+100);
    const pausedBefore=await field();
    game.rig.azimuth+=2.3;
    game.rig.distance=1400;
    for(let i=0;i<8;i++) await game.frame(game.lastTime+100);
    const pausedAfter=await field();
    results.pausePreservesWake=pausedBefore.pixels.every((v,i)=>v===pausedAfter.pixels[i]);
    results.orbitPreservesAnchor=pausedBefore.centers.every((c,i)=>c.every((v,j)=>v===pausedAfter.centers[i][j]));
    game.rig.distance=650;
    game.rig.elevation=0.6;
    game.rig.recenter();
    game.rig.elevation=0.6;
    command={throttle:1,rudder:1};
    await advance(20);
    const turning=await field();
    results.turn=Math.abs(Math.atan2(Math.sin(game.simulation.ship.heading-cruise.heading),Math.cos(game.simulation.ship.heading-cruise.heading)));
    results.oldTrackFoam=turning.at(point.x,point.z);
    results.turnRetainsTrail=results.turn>0.1 && results.oldTrackFoam>0.005;
    window.wakeTurningImage=await capture();
    command={throttle:0,rudder:0};
    await advance(40);
    results.foamAfterStop=(await field()).total;
    results.foamWhileTurning=turning.total;
    results.stoppedWakeFades=results.foamAfterStop<turning.total;
    window.wakeStoppedImage=await capture();
    game.setInPort(true);
    await advance(1);
    results.portClearsWake=(await field()).max===0;
    results.passed=results.stationaryClean && results.visibleTrail
      && results.pausePreservesWake && results.orbitPreservesAnchor && results.turnRetainsTrail && results.stoppedWakeFades
      && results.wakeSpreads && results.portClearsWake;
    window.captureWake=capture;
    report();
  } catch(e) { results.passed=false; results.error=String(e?.stack ?? e); report(); }
  window.disposeWakeDiagnostic=()=>game.dispose();
</script></html>
