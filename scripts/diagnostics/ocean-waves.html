<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ocean waves</title>
<style>html,body{margin:0;background:#10232e}#scene{width:1600px;height:900px}canvas{display:block}output{position:fixed;top:8px;left:8px;color:white;background:#10232ecc;padding:8px;font:14px sans-serif;white-space:pre}</style>
<div id="scene"></div><output>Loading ocean waves…</output>
<script type="module">
// Development-only check of the wave field alone (src/game/ocean/waves): a displaced, simply
// shaded sea at the ocean-review cameras, plus GPU-vs-CPU validation and timings.
// `scripts/browser/ocean-waves.ts` drives it. ?quality=low|medium|high|ultra; ?seaState=off draws the calibration table's
// wavelengths as given (the game's realism.seaState switch, on by default).
import * as THREE from 'three/webgpu';
import { attribute, cameraPosition, dot, exp, float, int, ivec2, max, mix, normalize, positionGeometry, positionWorld, pow, reflect,
  screenCoordinate, texture, uniform, varying, vec2, vec3, vec4 } from 'three/tsl';
import { createWaveField, createWaveHeightSampler } from '/src/game/ocean/waves/index.ts';
import { OCEAN_TIERS } from '/src/game/ocean/quality.ts';
import { buildSpectrum, FOLD_PERIOD } from '/src/game/ocean/waves/spectrum.ts';
import { activeModes, referenceTexel } from '/src/game/ocean/waves/reference.ts';
import { windSea } from '/src/maps/seaCalibration.ts';
import { oceanMap } from '/src/maps/catalog.ts';
import { foamPatterns, inWhitecap, spreadWhitecaps, whitecapFoam, windrowOpacity } from '/src/game/ocean/surface/foam.ts';
import { foamTexture } from '/src/game/ocean/surface/foamTexture.ts';
import { whitecapCoverage } from '/src/game/ocean/waves/whitecaps.ts';
import { WHITECAP_LIFETIME, windrowFoam } from '/src/game/VisualEnvironment.ts';

const query = new URLSearchParams(location.search);
const output = document.querySelector('output');
const errors = [];
addEventListener('error', event => errors.push(event.message));
addEventListener('unhandledrejection', event => errors.push(String(event.reason?.message ?? event.reason)));

const renderer = new THREE.WebGPURenderer({ antialias: true, powerPreference: 'high-performance', reversedDepthBuffer: true });
renderer.setSize(1600, 900); renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.querySelector('#scene').append(renderer.domElement);
await renderer.init();
if (!renderer.backend.isWebGPUBackend) throw new Error('The ocean requires WebGPU');
const backend = 'webgpu';
const sync = () => renderer.backend.device.queue.onSubmittedWorkDone();

/** Named winds (m/s); any number also works. Seas and foam gains come from the game's calibration. */
const SEAS = { calm: 3, moderate: 9, storm: 25 };
const params = { significantHeight: 0, windSpeed: 0, windDirection: .61, peakWavelength: 1, choppiness: 0, gamma: 2.6, directionalSharpness: .8, seed: 1, dirty: true };
const foam = { coverageScale: 1, lifetime: WHITECAP_LIFETIME };
/** The crest foam's look as the game sets it in the Atlantic (VisualEnvironment). */
const foamLook = { opacity: 1, windStretch: .5 };
const foamMap = foamTexture();
const realism = { seaState: query.get('seaState') !== 'off' };
function setSea(name) {
  const sea = windSea(oceanMap('north-atlantic'), SEAS[name] ?? Number(name));
  Object.assign(params, { significantHeight: sea.significantHeightM, windSpeed: sea.windSpeed, peakWavelength: sea.peakWavelength, choppiness: sea.choppiness, dirty: true });
}

let quality = query.get('quality') ?? 'high', field, sampler, mesh;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x6f8fb5);
const camera = new THREE.PerspectiveCamera(60, 16 / 9, .5, 60000);
const sun = new THREE.Vector3(.45, .6, .65).normalize();

/** Camera-centred polar grid: logarithmic rings, so vertex spacing grows with distance. */
function polarGrid(rings = 1100, segments = 1536, inner = .5, outer = 45000) {
  const ratio = (outer / inner) ** (1 / rings), positions = [], spacing = [], index = [];
  for (let i = 0; i <= rings; i++) {
    const r = inner * ratio ** i;
    for (let j = 0; j < segments; j++) {
      const a = 2 * Math.PI * j / segments;
      positions.push(r * Math.cos(a), 0, r * Math.sin(a));
      spacing.push(Math.max(r * (ratio - 1), 2 * Math.PI * r / segments));
    }
  }
  for (let i = 0; i < rings; i++) for (let j = 0; j < segments; j++) {
    const a = i * segments + j, b = i * segments + (j + 1) % segments, c = a + segments, d = b + segments;
    index.push(a, b, c, b, d, c);
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute('spacing', new THREE.Float32BufferAttribute(spacing, 1));
  geometry.setIndex(index);
  return geometry;
}
const grid = polarGrid();
const center = uniform(new THREE.Vector2());
const show = query.get('show') ?? 'shaded';

function build(tileScale = 1) {
  field?.dispose(); sampler?.dispose();
  if (mesh) { scene.remove(mesh); mesh.material.dispose(); }
  field = createWaveField(renderer, OCEAN_TIERS[quality].cascades, params, foam, realism);
  sampler = createWaveHeightSampler(renderer, field);
  const material = new THREE.MeshBasicNodeMaterial();
  const xz = positionGeometry.xz.add(center);
  const displaced = field.displacement(xz, attribute('spacing', 'float'));
  material.positionNode = vec3(xz.x, 0, xz.y).add(displaced);
  const gridXZ = varying(xz);
  const wave = field.surface(gridXZ);
  const normal = normalize(vec3(wave.slope.x.negate(), 1, wave.slope.y.negate()));
  const view = normalize(cameraPosition.sub(positionWorld));
  const fresnel = float(.02).add(float(.98).mul(pow(float(1).sub(max(dot(normal, view), 0)), 5)));
  const ray = reflect(view.negate(), normal);
  const sky = mix(vec3(.55, .66, .78), vec3(.18, .32, .55), pow(max(ray.y, 0), .45));
  const roughness = wave.slopeVariance.add(.0004);
  const half = normalize(vec3(sun.x, sun.y, sun.z).add(view));
  const nh = max(dot(normal, half), 0), tan2 = float(1).sub(nh.mul(nh)).div(nh.mul(nh).max(1e-4));
  const glint = exp(tan2.negate().div(roughness.mul(2))).div(roughness.mul(4 * Math.PI).mul(pow(nh, 4).max(1e-3))).mul(3);
  const body = vec3(.04, .06, .07).mul(float(.5).add(max(dot(normal, vec3(sun.x, sun.y, sun.z)), 0).mul(.5)));
  const water = mix(body, sky, fresnel).add(vec3(1, .95, .85).mul(glint).mul(fresnel));
  // Foam is coverage: the share of the pixel that is white water.
  const shaded = mix(water, vec3(.85, .88, .9), wave.foam.clamp(0, 1));
  const distance = cameraPosition.sub(positionWorld).length();
  const fogged = mix(shaded, vec3(.62, .72, .82), float(1).sub(exp(distance.mul(-1 / 22000))));
  material.colorNode = {
    shaded: fogged,
    height: vec3(displaced.y.div(params.significantHeight || 1).mul(.25).add(.5)),
    slope: vec3(wave.slope.mul(.5).add(.5), 0),
    foam: vec3(wave.foam.mul(.5)),
    variance: vec3(wave.slopeVariance.mul(20)),
    jacobian: vec3(wave.jacobian.mul(.5)),
  }[show];
  mesh = new THREE.Mesh(grid, material);
  mesh.frustumCulled = false;
  scene.add(mesh);
}

let time = 60;
async function frames(count, dt = 1 / 60) {
  for (let i = 0; i < count; i++) {
    time += dt; field.update(renderer, time, dt);
    center.value.set(Math.round(camera.position.x), Math.round(camera.position.z));
    renderer.render(scene, camera);
    if (i % 30 === 29) await sync();
  }
}
const zoom = magnification => 2 * Math.atan(Math.tan(52 * Math.PI / 360) / magnification) * 180 / Math.PI;
const look = (position, target, fov = 60) => {
  camera.position.set(...position); camera.lookAt(...target);
  camera.fov = fov; camera.updateProjectionMatrix(); camera.updateMatrixWorld();
};
const NEAR = [[300, 95, 350], [0, 20, 0]], WIDE = [[550, 200, 700], [-650, 75, -1000]];
const VIEWS = {
  near: () => look(...NEAR),
  close: () => look([40, 18, 60], [0, 0, 0], 60),
  wide: () => look(...WIDE),
  grazing: () => look([0, 12, 160], [0, 6, -4000], 55),
  zoom5km: () => look([0, 29, 0], [5000, 14, 0], zoom(24)),
  zoom20km: () => look([0, 29, 0], [20000, 14, 0], zoom(24)),
  air: () => look([0, 2600, 2400], [0, 0, -1800], 52),
};

async function capture() {
  renderer.render(scene, camera);
  await sync();
  return renderer.domElement.toDataURL('image/png');
}

/** Copies one cascade layer (at one mip level) of the field's outputs into readable float targets. */
async function readLayer(cascade, level = 0) {
  const n = field.cascades[0].resolution >> level, count = field.cascades.length, result = [];
  for (const source of field.textures) {
    const target = new THREE.RenderTarget(n, n, { type: THREE.FloatType, depthBuffer: false });
    const material = new THREE.NodeMaterial();
    const load = texture(source).load(ivec2(screenCoordinate)).level(int(level));
    material.fragmentNode = count > 1 ? load.depth(int(cascade)) : load;
    material.blending = THREE.NoBlending;
    const quad = new THREE.QuadMesh(material);
    renderer.setRenderTarget(target); quad.render(renderer); renderer.setRenderTarget(null);
    result.push(await renderer.readRenderTargetPixelsAsync(target, 0, 0, n, n));
    target.dispose(); material.dispose();
  }
  return result;
}

/** Cascades holding less of the sea's variance than this are reported but not judged. */
const NEGLIGIBLE_SHARE = 1e-6;
/** GPU fields vs a direct CPU inverse DFT of the same amplitudes at the same folded time. */
async function validate() {
  const report = { quality, backend, cascades: [] };
  const t = 1234.5678;
  params.dirty = true; field.update(renderer, t, 0); await sync();
  const phase = Math.fround((t % FOLD_PERIOD) / FOLD_PERIOD);
  // The field draws its own sea (realism applied) on its current tiles.
  const sea = field.sea, spectrum = buildSpectrum(field.cascades, sea);
  report.seaState = realism.seaState; report.peakWavelength = sea.peakWavelength; report.choppiness = sea.choppiness;
  let variance = 0;
  const total = spectrum.cascades.reduce((sum, c) => sum + c.variance, 0);
  for (let c = 0; c < field.cascades.length; c++) {
    const [displacement, derivatives, extras] = await readLayer(c), cascade = spectrum.cascades[c], modes = activeModes(cascade);
    const n = cascade.resolution, names = ['dx', 'dy', 'dz', 'hx', 'hz', 'dxx', 'dzz', 'dxz'];
    const worst = Object.fromEntries(names.map(k => [k, 0])), scale = Object.fromEntries(names.map(k => [k, 0]));
    for (let i = 0; i < 160; i++) {
      const x = (i * 97 + 13) % n, z = (i * 61 + 7 * (i >> 3)) % n, at = (z * n + x) * 4;
      const cpu = referenceTexel(cascade, modes, sea.choppiness, phase, x, z);
      const gpu = { dx: displacement[at], dy: displacement[at + 1], dz: displacement[at + 2], hx: derivatives[at], hz: derivatives[at + 1], dxx: derivatives[at + 2], dzz: derivatives[at + 3], dxz: extras[at] };
      for (const k of names) { worst[k] = Math.max(worst[k], Math.abs(gpu[k] - cpu[k])); scale[k] = Math.max(scale[k], Math.abs(cpu[k])); }
    }
    let mean = 0, square = 0;
    for (let i = 0; i < n * n; i++) { mean += displacement[i * 4 + 1]; square += displacement[i * 4 + 1] ** 2; }
    mean /= n * n; variance += square / (n * n) - mean * mean;
    // Mipmaps are regenerated for every layer each update: a coarse level equals block means of level 0.
    const level = 3, block = 1 << level, [, coarse] = await readLayer(c, level), m = n >> level;
    let mipError = 0, rms = 0;
    for (let i = 0; i < n * n; i++) rms += derivatives[i * 4] ** 2;
    for (let bz = 0; bz < m; bz++) for (let bx = 0; bx < m; bx++) {
      let mean = 0;
      for (let z = 0; z < block; z++) for (let x = 0; x < block; x++) mean += derivatives[((bz * block + z) * n + bx * block + x) * 4];
      mipError = Math.max(mipError, Math.abs(coarse[(bz * m + bx) * 4] - mean / (block * block)));
    }
    report.cascades.push({ size: cascade.size, share: cascade.variance / total, relativeError: Object.fromEntries(names.map(k => [k, scale[k] ? worst[k] / scale[k] : 0])), mipError: mipError / Math.sqrt(rms / (n * n)) });
  }
  report.hm0 = 4 * Math.sqrt(variance); report.hm0Target = params.significantHeight;
  // A cascade far from the peak can hold next to nothing (a light air's 1 km tile: 1e-10 of the variance, amplitudes
  // below half-float resolution), where a relative error measures only the storage of zero; it is reported, not judged.
  report.maxRelativeError = Math.max(...report.cascades.filter(c => c.share >= NEGLIGIBLE_SHARE).flatMap(c => Object.values(c.relativeError)));
  return report;
}

/** heightAt at displaced grid points against the grid's own displacement. Where the grid folds
 * (J < 0.3) another sheet may legitimately answer, so those points are reported apart. */
async function heights() {
  const n = 128, target = new THREE.RenderTarget(n, 1, { type: THREE.FloatType, depthBuffer: false });
  const points = Array.from({ length: n }, (_, i) => ({ x: (i * 37.3) % 400 - 200, z: (i * 91.7) % 400 - 200 }));
  const data = new Float32Array(n * 4); points.forEach((p, i) => { data[i * 4] = p.x; data[i * 4 + 1] = p.z; });
  const input = new THREE.DataTexture(data, n, 1, THREE.RGBAFormat, THREE.FloatType); input.needsUpdate = true;
  const material = new THREE.NodeMaterial();
  const at = texture(input).load(ivec2(int(screenCoordinate.x), 0)).xy, e = .05;
  const d = offset => field.displacement(at.add(vec2(...offset)));
  const ex = d([e, 0]).sub(d([-e, 0])).div(2 * e), ez = d([0, e]).sub(d([0, -e])).div(2 * e);
  const jacobian = ex.x.add(1).mul(ez.z.add(1)).sub(ex.z.mul(ez.x));
  material.fragmentNode = vec4(d([0, 0]), jacobian);
  material.blending = THREE.NoBlending;
  renderer.setRenderTarget(target); new THREE.QuadMesh(material).render(renderer); renderer.setRenderTarget(null);
  const grid = await renderer.readRenderTargetPixelsAsync(target, 0, 0, n, 1);
  sampler.setPositions(points.map((p, i) => ({ x: p.x + grid[i * 4], z: p.z + grid[i * 4 + 2] })));
  await sampler.refresh();
  const all = [], unfolded = [];
  let normalWorst = 0;
  for (let i = 0; i < n; i++) {
    const error = Math.abs(sampler.heights[i] - grid[i * 4 + 1]);
    all.push(error); if (grid[i * 4 + 3] > .3) unfolded.push(error);
    normalWorst = Math.max(normalWorst, Math.abs(Math.hypot(sampler.normals[i * 3], sampler.normals[i * 3 + 1], sampler.normals[i * 3 + 2]) - 1));
  }
  all.sort((a, b) => a - b);
  target.dispose(); material.dispose(); input.dispose();
  return { points: n, unfoldedPoints: unfolded.length, median: all[n >> 1], p90: all[Math.floor(n * .9)], worst: all[n - 1],
    worstUnfolded: unfolded.reduce((a, b) => Math.max(a, b), 0), significantHeight: params.significantHeight, normalLengthError: normalWorst };
}

/** Foam and bubbles persist and decay with dt and never change on a paused (dt = 0) update. */
async function foamCheck() {
  // Every layer's foam and bubble channels (extras .y and .w).
  const layerFoam = async () => {
    const all = [];
    for (let c = 0; c < field.cascades.length; c++) all.push((await readLayer(c))[2].filter((_, i) => i % 4 === 1 || i % 4 === 3));
    return Float32Array.from(all.flatMap(layer => Array.from(layer)));
  };
  await frames(240);
  const before = await layerFoam();
  field.update(renderer, time, 0); await sync();
  const paused = await layerFoam();
  params.dirty = true; params.significantHeight *= 1.5;
  field.update(renderer, time, 0); await sync();
  const rebuilt = await layerFoam();
  params.significantHeight /= 1.5; params.dirty = true;
  let sum = 0, most = -Infinity, least = Infinity;
  for (const v of before) { sum += v; most = Math.max(most, v); least = Math.min(least, v); }
  return { foamMean: sum / before.length, foamMax: most, minimum: least,
    pausedUnchanged: before.every((v, i) => v === paused[i]), rebuiltWhilePausedUnchanged: before.every((v, i) => v === rebuilt[i]) };
}

/** Foam as the surface draws it, after `seconds` of field-only updates at wind `sea` with the realistic sea state on or
 * off, averaged over `samples` instants 4 s apart, each a 1,024 m square at 0.5 m per pixel (four 512 m tiles), through
 * the material's own foam functions: the share of the sea whitecap patches cover (their area, Monahan's W), the
 * windrows' share, both together, the mean opacity of all foam (what brightens the sea), and the mean spread foam
 * (`foamMean`) and the opacity its mean path gives. `only` lets a single cascade break. */
async function foamCoverage(sea, seconds = 15, seaState = realism.seaState, only, samples = 3) {
  setSea(sea);
  realism.seaState = seaState;
  time += 1 / 60; field.update(renderer, time, 1 / 60);
  if (only !== undefined) field.breaking.forEach((breaking, c) => { if (c !== only) breaking.share = 0; });
  for (let i = 0; i < seconds * 60; i++) { time += 1 / 60; field.update(renderer, time, 1 / 60); if (i % 120 === 119) await sync(); }
  const mean = new Array(8).fill(0);
  for (let sample = 0; sample < samples; sample++) {
    if (sample) for (let i = 0; i < 240; i++) { time += 1 / 60; field.update(renderer, time, 1 / 60); if (i % 120 === 119) await sync(); }
    for (const [x, z] of [[0, 0], [512, 0], [0, 512], [512, 512]]) {
      const frame = await coverageFrame(x, z);
      frame.forEach((value, c) => { mean[c] += value / (samples * 4); });
    }
  }
  const [whitecapArea, windrowArea, area, opacity, whitecapOpacity, foamMean, meanPath, amount] = mean;
  return { wind: params.windSpeed, significantHeight: params.significantHeight, seaState, peakWavelength: field.sea.peakWavelength, choppiness: field.sea.choppiness,
    tile: field.cascades[0].size, breaking: field.breaking.map(b => ({ share: b.share, threshold: b.threshold, period: b.period })),
    whitecapArea, windrowArea, area, opacity, whitecapOpacity, foamMean, meanPath, amount, target: whitecapCoverage(params.windSpeed) };
}

/** One 512 m tile at 0.5 m per pixel, its corner at (x, z): the mean of whitecap area (patch at least half there),
 * windrow area (their share), both, all foam's opacity, the whitecaps' opacity, the spread foam, the opacity of the
 * whitecaps' mean path from it, and the drawn foam amount. */
async function coverageFrame(x, z) {
  const n = 1024, sums = [];
  for (const pass of [0, 1]) {
    const target = new THREE.RenderTarget(n, n, { type: THREE.FloatType, depthBuffer: false });
    const material = new THREE.NodeMaterial();
    const xz = screenCoordinate.mul(512 / n).add(vec2(x, z)), sample = field.surface(xz);
    const patterns = foamPatterns(foamMap, xz, float(params.windDirection), float(foamLook.windStretch * 2 + 1), vec3(0, 1, 0));
    const { pattern, blur, streaks, streaksBlur, lines, gather, coarse } = patterns;
    const whitecaps = whitecapFoam(sample.foam, sample.fresh, sample.foamMean, sample.bubbles, sample.whitecapShare, patterns, float(0));
    const rowsFoam = windrowFoam(params.windSpeed);
    const rowsShare = windrowOpacity(float(rowsFoam.coverage), lines, foamMap.userData.streakMean, gather, pattern.r, streaks, float(1), sample.jacobian);
    const rows = windrowOpacity(float(rowsFoam.coverage), lines, foamMap.userData.streakMean, gather, pattern.r, streaks, max(blur, streaksBlur), sample.jacobian)
      .mul(rowsFoam.opacity);
    const patch = inWhitecap(sample.foam, pattern, blur);
    const opacity = float(1).sub(float(1).sub(whitecaps.opacity.clamp(0, 1)).mul(float(1).sub(rows.clamp(0, 1))));
    material.fragmentNode = pass
      ? vec4(whitecaps.opacity, sample.foamMean, spreadWhitecaps(sample.foamMean, sample.bubbles, coarse, float(0)), sample.foam)
      : vec4(patch, rowsShare, float(1).sub(float(1).sub(patch).mul(float(1).sub(rowsShare))), opacity);
    material.blending = THREE.NoBlending;
    renderer.setRenderTarget(target); new THREE.QuadMesh(material).render(renderer); renderer.setRenderTarget(null);
    const pixels = await renderer.readRenderTargetPixelsAsync(target, 0, 0, n, n);
    const mean = [0, 0, 0, 0];
    for (let i = 0; i < n * n; i++) for (let c = 0; c < 4; c++) mean[c] += pixels[i * 4 + c] / (n * n);
    target.dispose(); material.dispose();
    sums.push(...mean);
  }
  return sums;
}

/** CPU time of update() (batches without waiting) and GPU-inclusive wall time per update. Other
 * GPU clients (other browsers) inflate the wall time; compare minima across repeated runs. */
async function timing(updates = 120) {
  const cpu = [], batches = [], batch = 20;
  for (let run = 0; run < updates / batch; run++) {
    await sync();
    const start = performance.now();
    for (let i = 0; i < batch; i++) { time += 1 / 60; field.update(renderer, time, 1 / 60); }
    cpu.push((performance.now() - start) / batch);
    await sync();
    batches.push((performance.now() - start) / batch);
  }
  const before = renderer.info.render.calls;
  time += 1 / 60; field.update(renderer, time, 1 / 60);
  const passes = renderer.info.render.calls - before;
  const median = values => [...values].sort((a, b) => a - b)[values.length >> 1];
  return { quality, backend, passes, cpuMedian: median(cpu), perUpdateMedian: median(batches), perUpdateMin: Math.min(...batches) };
}

window.oceanWaves = {
  backend, errors, views: Object.keys(VIEWS), seas: Object.keys(SEAS),
  async setQuality(name) { quality = name; build(); await frames(2); },
  async view(name, sea = 'moderate', seconds = 6) {
    setSea(sea); VIEWS[name](); await frames(Math.round(seconds * 60)); return { name, sea, backend, errors: [...errors] };
  },
  capture, validate, heights, foamCheck, foamCoverage, timing, readLayer, renderer, get field() { return field; },
};
renderer.info.autoReset = false;
setSea('moderate'); build(); VIEWS.near(); await frames(2);
window.ready = true; output.textContent = '';
</script>
</html>
