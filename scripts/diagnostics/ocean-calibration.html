<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ocean calibration</title>
<style>
  :root{font-family:Barlow,sans-serif;color:#edf1ec;background:#132d38;color-scheme:dark}
  *{box-sizing:border-box}body{margin:0}#scene{position:fixed;inset:0}canvas{display:block}
  header{position:fixed;top:24px;left:28px;pointer-events:none;background:#132d38ed;border-radius:3px;padding:12px 16px}
  h1{font:600 30px 'Barlow Condensed',sans-serif;margin:0 0 6px}p{margin:0;line-height:1.5}
  #description{max-width:42ch}#status{position:fixed;top:24px;right:28px;background:#132d38;padding:10px 14px}
  #controls{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);width:min(900px,calc(100% - 32px));background:#132d38f5;border:1px solid #cfdfdf35;border-radius:3px;padding:14px 18px}
  nav,.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}nav{margin-bottom:12px}
  button,select{font:500 16px Barlow,sans-serif;color:inherit;border:1px solid #cfdfdf35;background:#0e2530;border-radius:3px;min-height:40px;padding:8px 12px;cursor:pointer}
  button[aria-pressed=true]{background:#e0c58d;color:#152b32;border-color:#e0c58d}button:hover,select:hover{border-color:#efd5a0}
  button:disabled{opacity:.5;cursor:wait}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #e0c58d;outline-offset:3px}
  label{display:flex;align-items:center;gap:10px;font-size:16px}.row{justify-content:space-between;gap:14px}
  input{accent-color:#e0c58d;width:170px;cursor:pointer}output{font-variant-numeric:tabular-nums}#wind-value{width:55px}
  #values{font-size:14px;color:#bacbd0;margin-top:12px;font-variant-numeric:tabular-nums}
  #hint{font-size:14px;color:#bacbd0;margin-top:5px}::selection{background:#e0c58d;color:#152b32}
  @media(max-width:640px){header{top:16px;left:16px;max-width:calc(100% - 32px)}h1{font-size:28px}#description{font-size:14px;max-width:30ch}#controls{bottom:12px;padding:12px}nav{gap:5px}nav button{flex:1;padding:7px;font-size:14px}input{width:120px}.row{gap:10px}#status{top:140px;left:16px;right:auto}#values{font-size:12px}}
</style>
<div id="scene"></div>
<header><h1>Ocean calibration</h1><p>Calibrated wind-wave heights with the selected open-ocean foam.</p></header>
<output id="status" role="status">Preparing the sea…</output>
<section id="controls" aria-label="Ocean calibration" hidden>
  <div class="row">
    <label>Wind <input id="wind" type="range" min="0" max="30" step="0.5" value="9"><output id="wind-value">9 m/s</output></label>
    <label>Waters <select id="map"><option value="north-atlantic">North Atlantic</option><option value="pacific-islands">Pacific Islands</option><option value="arctic-passage">Arctic Passage</option><option value="indian-volcanic-coast">Volcanic Coast</option></select></label>
    <button id="play" aria-pressed="false">Play waves</button><button id="measure">Measure height</button>
  </div>
  <p id="values"></p><p id="hint">Development diagnostic · 250 m hull · GPU samples are visual only</p>
</section>
<script type="module">
import '@fontsource/barlow/latin-400.css';
import '@fontsource/barlow/latin-500.css';
import '@fontsource/barlow-condensed/latin-600.css';
import { Vector3, DataUtils } from 'three/webgpu';
import { Game } from '/src/game/Game.ts';
import { GRAPHICS_PRESETS } from '/src/game/graphicsSettings.ts';
import { loadShipPresets } from '/src/ships/presetLoading.ts';
import { oceanMap, isOceanMapId } from '/src/maps/catalog.ts';
import { battleEnvironment } from '/src/maps/conditions.ts';
if (!import.meta.env.DEV) throw new Error('Development diagnostic only.');
const params=new URLSearchParams(location.search),status=document.querySelector('#status');
const quality=params.get('quality')??'high';
let wind=Math.max(0,Math.min(30,Number(params.get('wind')??9)||0));
let mapId=isOceanMapId(params.get('map'))?params.get('map'):'north-atlantic';
let playing=false,busy=false,last=0;
await loadShipPresets(['bismarck']);
const game=new Game(document.querySelector('#scene'),{...(GRAPHICS_PRESETS[quality]??GRAPHICS_PRESETS.high),renderScale:100},{
  progress:label=>status.textContent=label,ready:()=>{},telemetry:()=>{},pause:()=>{},hud:()=>{},
  error:message=>{window.calibrationError=message;status.hidden=false;status.textContent=message;},
});
game.scheduleFrame=()=>{};game.start();await game.initialization;
if(window.calibrationError)throw new Error(window.calibrationError);
game.renderer.domElement.setAttribute('aria-label','Bismarck and the calibrated ocean. Use the controls to change wind and waters.');
game.setInPort(false);game.setPaused(true);game.rig.update=()=>{};game.battlefieldCamera.applyTransition=()=>{};game.input.dispose();
game.camera.fov=52;game.camera.position.set(255,78,290);game.camera.lookAt(0,0,-15);game.camera.updateProjectionMatrix();game.camera.updateMatrixWorld();
const water=game.water,step=water.update.bind(water);water.deterministic=true;
let oceanDt=0;water.update=()=>step(oceanDt);
function lock(value){busy=value;document.querySelectorAll('#controls button,#controls input,#controls select').forEach(e=>e.disabled=value);}
function state(){return {ready:!busy,wind,mapId,quality,playing,tick:water.tick,target: battleEnvironment(oceanMap(mapId),'map','map',{windSpeed:wind}).waves.significantHeightM};}
function ui(measured){
  document.querySelector('#wind').value=wind;document.querySelector('#wind-value').textContent=wind+' m/s';document.querySelector('#map').value=mapId;
  document.querySelector('#play').textContent=playing?'Freeze waves':'Play waves';document.querySelector('#play').setAttribute('aria-pressed',String(playing));
  document.querySelector('#values').textContent=`Target significant height ${state().target.toFixed(2)} m${measured===undefined?'':` · Measured ${measured.toFixed(2)} m`} · ${quality} quality`;
  params.set('wind',wind);params.set('map',mapId);history.replaceState(null,'','?'+params);
}
async function render(dt=0){
  oceanDt=dt;game.renderer._nodes.nodeFrame.update();
  try{await game.frame(performance.now());}finally{oceanDt=0;}
  if(window.calibrationError)throw new Error(window.calibrationError);
}
async function setConditions(speed=wind,map=mapId){
  playing=false;while(busy)await new Promise(requestAnimationFrame);
  lock(true);wind=Math.max(0,Math.min(30,speed));mapId=map;status.hidden=false;status.textContent='Settling whitecaps…';
  try{
    game.environment.setBattle({timeOfDay:'map',weather:'map',conditions:{windSpeed:wind}});game.environment.setScene(mapId,false);
    water.foam.waves.enabled=false;await step(1/60);water.foam.waves.enabled=true;water.syncToTick(2880);
    for(let i=0;i<120;i++){game.renderer._nodes.nodeFrame.update();await step(.1);if(i%12===0)await new Promise(requestAnimationFrame);}
    await render();ui();status.hidden=true;
  }finally{lock(false);}
  return state();
}
async function measure(){
  playing=false;while(busy)await new Promise(requestAnimationFrame);
  lock(true);ui();status.hidden=false;status.textContent='Sampling wave heights…';
  const sampler=water.buoyancy.getSampler(),heights=[];
  try{
    for(const tick of [3600,7200,10800]){
      water.syncToTick(tick-1);await render(1/60);let seed=42;
      const random=()=>{seed=(1664525*seed+1013904223)>>>0;return seed/4294967296;};
      for(let batch=0;batch<16;batch++){
        sampler.setPositions(Array.from({length:128},()=>new Vector3(random()*1024,0,random()*1024)));
        await sampler.update();heights.push(...sampler.getSamples().map(sample=>sample.height));
      }
    }
    const mean=heights.reduce((a,b)=>a+b,0)/heights.length;
    const height=4*Math.sqrt(heights.reduce((a,b)=>a+(b-mean)**2,0)/heights.length);
    water.syncToTick(3599);await render(1/60);ui(height);status.hidden=true;
    return {...state(),ready:true,sampleCount:heights.length,significantHeightM:height};
  }finally{lock(false);}
}
async function foamField(){
  const f=water._foamAccumulation,t=f._targets[f._current],p=await game.renderer.readRenderTargetPixelsAsync(t,0,0,t.width,t.height);
  let sum=0,peak=0;for(let i=0;i<p.length;i+=4){const e=DataUtils.fromHalfFloat(p[i]);sum+=e;peak=Math.max(peak,e);}
  return {mean:sum/(p.length/4),peak};
}
async function still(type='image/png'){await render();game.pipeline.render();return game.renderer.domElement.toDataURL(type,.92);}
document.querySelector('#wind').oninput=e=>document.querySelector('#wind-value').textContent=e.target.value+' m/s';
document.querySelector('#wind').onchange=e=>void setConditions(Number(e.target.value));
document.querySelector('#map').onchange=e=>void setConditions(wind,e.target.value);
document.querySelector('#play').onclick=()=>{playing=!playing;last=performance.now();ui();};
document.querySelector('#measure').onclick=()=>void measure();
async function animate(now){
  if(playing&&!busy){busy=true;try{await render(Math.min(.05,(now-last)/1000));}finally{busy=false;}}
  last=now;requestAnimationFrame(animate);
}
await setConditions();document.querySelector('#controls').hidden=false;
window.oceanCalibration={game,setConditions,state,render,measure,foamField,still};requestAnimationFrame(animate);
</script>
</html>
