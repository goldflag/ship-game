<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Ship shadows on water · runtime review</title>
<style>body{margin:0;background:#132d38;color:#edf1ec;font:14px sans-serif}#scene{width:1280px;height:720px}canvas{display:block}#status{position:fixed;left:16px;top:16px}</style>
<div id="scene"></div><output id="status">Preparing shadow review…</output>
<script type="module">
// The ocean surface receives the sun's shadow map through `ocean.setShadowNode` (WaterShadows.ts).
// ?test runs the check; ?calm flattens the sea; ?quality=low|medium|high|ultra.
import { Game } from '/src/game/Game.ts';
import { GRAPHICS_PRESETS } from '/src/game/graphicsSettings.ts';
import { loadShipPresets } from '/src/ships/presetLoading.ts';
await loadShipPresets(['bismarck']);
const params=new URLSearchParams(location.search),status=document.querySelector('#status');
const game=new Game(document.querySelector('#scene'),{...(GRAPHICS_PRESETS[params.get('quality')]??GRAPHICS_PRESETS.high),renderScale:100},{
  progress:label=>status.textContent=label,ready:()=>{},telemetry:()=>{},pause:()=>{},hud:()=>{},
  error:message=>{window.reviewError=message;status.textContent=message;},
});
game.scheduleFrame=()=>{};game.start();await game.initialization;
if(window.reviewError) throw new Error(window.reviewError);
game.setInPort(false);game.setPaused(true);game.rig.update=()=>{};game.battlefieldCamera.applyTransition=()=>{};
game.targetView.root.visible=false;
game.camera.position.set(260,200,270);game.camera.lookAt(0,0,0);
game.camera.updateProjectionMatrix();game.camera.updateMatrixWorld();
// Paused frames never advance the ocean's clock, so every capture shows the same sea.
const ocean=game.ocean;ocean.time=60;
if(params.has('calm')){ocean.waves.significantHeight=0;ocean.waves.dirty=true;}
await still();
// The receiver node the game bound for the current Graphics settings (the facade keeps it privately).
const shadowNode=()=>ocean.shadow;
const node=shadowNode();
function surfaceShadows(enabled){ocean.setShadowNode(enabled?node:null);}
async function still(){
  for(let i=0;i<2;i++){game.renderer._nodes.nodeFrame.update();await game.frame(performance.now());if(window.reviewError)throw new Error(window.reviewError);}
  // Present the prepared post-process textures and capture synchronously.
  game.pipeline.render();
  return game.renderer.domElement.toDataURL('image/png');
}
async function pixels(){
  const image=new Image();image.src=await still();await image.decode();
  const canvas=document.createElement('canvas');canvas.width=image.width;canvas.height=image.height;
  const context=canvas.getContext('2d');context.drawImage(image,0,0);return context.getImageData(0,0,image.width,image.height).data;
}
function difference(before,after){
  let darker=0,brighter=0,total=0;
  for(let i=0;i<before.length;i+=4){const delta=(before[i]+before[i+1]+before[i+2]-after[i]-after[i+1]-after[i+2])/3;
    if(delta>2)darker++;if(delta< -2)brighter++;total+=Math.max(0,delta);}
  return {darker,brighter,total};
}
async function check(){
  // Only water shadow reception changes: hull shading, reflections, sea time,
  // camera and light remain identical. Detect actual rendered shadow pixels.
  surfaceShadows(false);const before=await pixels();
  surfaceShadows(true);const after=await pixels();
  const visible=difference(before,after);
  surfaceShadows(false);const restored=difference(before,await pixels());
  const original={...game.graphics},levels={};
  game.applyGraphics({...original,waterShadows:'off'});const unshadowed=await pixels();
  const waterOff=shadowNode()===null;
  for(const quality of ['low','medium','high']){
    game.applyGraphics({...original,waterShadows:quality});
    levels[quality]=difference(unshadowed,await pixels());
  }
  game.applyGraphics({...original,waterShadows:'off'});
  const waterRestored=difference(unshadowed,await pixels());
  // Global Off overrides the receiver, while retaining its selected quality.
  game.applyGraphics({...original,shadows:'off',waterShadows:'medium'});await still();
  const off=shadowNode()===null&&game.graphics.waterShadows==='medium';
  game.applyGraphics({...game.graphics,shadows:'low'});await still();
  const enabled=shadowNode()!==null;
  game.applyGraphics({...game.graphics,shadows:'high'});await still();
  game.applyGraphics(original);await still();
  return {passed:visible.darker>100&&visible.brighter<visible.darker*.01&&restored.darker<20&&restored.brighter<20
      &&waterOff&&Object.values(levels).every(v=>v.darker>100&&v.brighter<v.darker*.01)
      &&waterRestored.darker<20&&waterRestored.brighter<20&&off&&enabled&&node!==null&&!window.reviewError,
    visible,restored,levels,waterOff,waterRestored,off,enabled,bound:node!==null};
}
window.shadowReview={game,still,surfaceShadows,pixels,difference,check};
await still();status.hidden=true;
window.shadowResult=params.has('test')?await check():{ready:true};
</script></html>
