<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ocean review</title>
<style>html,body{margin:0;background:#10232e}#scene{width:1600px;height:900px}canvas{display:block}output{position:fixed;top:8px;left:8px;color:white;background:#10232ecc;padding:8px;font:14px sans-serif}</style>
<div id="scene"></div><output>Loading ocean review…</output>
<script type="module">
// Development-only fixed scenes of the real game for reviewing the ocean side by side.
// `scripts/browser/ocean-review.ts` drives it and saves one PNG per scene.
// ?quality=low|medium|high|ultra, ?ship=<preset> for the player.
import { Game } from '/src/game/Game.ts';
import { GRAPHICS_PRESETS } from '/src/game/graphicsSettings.ts';
import { shipPreset } from '/src/ships/presets.ts';

const params = new URLSearchParams(location.search);
const output = document.querySelector('output'), noop = () => {};
const errors = [];
addEventListener('error', event => errors.push(event.message));
addEventListener('unhandledrejection', event => errors.push(String(event.reason?.message ?? event.reason)));
const quality = params.get('quality') ?? 'high';
const game = new Game(document.querySelector('#scene'), { ...GRAPHICS_PRESETS[quality], renderScale: 100 / Math.min(devicePixelRatio, 1.5) }, {
  progress: text => { output.textContent = text; }, ready: noop, telemetry: noop, pause: noop, hud: noop, error: message => errors.push(message),
}, shipPreset(params.get('ship') ?? 'bismarck'));
game.scheduleFrame = noop;
game.setInPort(true); game.start(); await game.initialization;
// ?realism=off shows the look first tuned to match the replaced library.
if (params.get('realism') === 'off') for (const feature of Object.keys(game.ocean.realism)) game.ocean.realism[feature] = false;
const rigUpdate = game.rig.update.bind(game.rig);

/** Seconds of waves run up to a frozen time: crest foam builds only while waves run and a paused frame keeps it,
 * so without them a scene would show the previous sea's foam (it decays over 2.8 s). */
const FOAM_WARMUP = 10;
/** Every scene renders the same frozen wave time: a paused frame never advances it, and parameter
 * changes still apply on the next update. Crest foam first runs up to it for FOAM_WARMUP seconds. */
const freeze = seconds => {
  for (let t = seconds - FOAM_WARMUP; t < seconds; t += 1 / 30) game.ocean.waveField.update(game.renderer, t, 1 / 30);
  game.ocean.time = seconds;
};

const frames = async count => { for (let i = 0; i < count; i++) { await new Promise(requestAnimationFrame); await game.frame(performance.now()); } };
const settle = async (count = 40) => {
  game.sky.pipeline.cloudTemporal.invalidateHistory();
  await frames(count);
};
const look = (position, target, fov = 60) => {
  game.rig.update = noop;
  game.camera.position.set(...position); game.camera.lookAt(...target);
  game.camera.fov = fov; game.camera.updateProjectionMatrix(); game.camera.updateMatrixWorld();
};
const place = (view, pose) => { Object.assign(view.actor.motion, pose); view.snap(); };
let battleKey, wakeState;
/** Enter (or stay in) a paused battle with these conditions; ships at fixed poses. */
async function battle({ map = 'north-atlantic', player = 'bismarck', hours = 12, wind = 9, cloud, range = 5000 } = {}) {
  const key = `${map}/${player}/${range}`;
  if (key !== battleKey) {
    game.rig.update = rigUpdate;
    game.setInPort(true); game.setPaused(true);
    await game.prepareBattle({ playerShipId: player, friendlyBots: [], enemies: ['bismarck'], spawnDistance: range, mapId: map, windSpeed: wind, timeHours: hours, ...(cloud === undefined ? {} : { cloudCover: cloud }) });
    battleKey = key;
  }
  game.environment.setBattle({ weather: 'map', timeOfDay: 'map', conditions: { timeHours: hours, windSpeed: wind, ...(cloud === undefined ? {} : { cloudCover: cloud }) } });
  game.setInPort(false); game.setPaused(true); game.rig.releasePointer();
  game.environment.setScene(game.simulation.mapId, false);
  place(game.playerView, { x: 0, y: 0, z: 0, heading: 0, pitch: 0, roll: 0 });
  if (game.targetView) { place(game.targetView, { x: range, y: 0, z: 0, heading: Math.PI / 2, pitch: 0, roll: 0 }); game.targetView.root.visible = true; }
  game.ship.position.copy(game.playerView.root.position);
  freeze(60);
}
const zoom = magnification => 2 * Math.atan(Math.tan(52 * Math.PI / 360) / magnification) * 180 / Math.PI;
const NEAR = [[300, 95, 350], [0, 20, 0]], WIDE = [[550, 200, 700], [-650, 75, -1000]];

/** Each scene leaves the game paused with a fixed camera and ocean time. */
const scenes = {
  port: async () => { game.rig.update = rigUpdate; game.setInPort(true); game.setPaused(true); battleKey = undefined; freeze(60); },
  near: async () => { await battle(); look(...NEAR); },
  wide: async () => { await battle(); look(...WIDE); },
  grazing: async () => { await battle(); look([0, 12, 160], [0, 6, -4000], 55); },
  sun: async () => {
    await battle({ hours: 16.5 });
    const sun = game.sky.sun.direction.value, heading = Math.atan2(sun.z, sun.x);
    look([-Math.cos(heading) * 260, 28, -Math.sin(heading) * 260], [Math.cos(heading) * 3000, 0, Math.sin(heading) * 3000], 60);
  },
  storm: async () => { await battle({ wind: 25 }); look(...NEAR); },
  calm: async () => { await battle({ wind: 3 }); look(...NEAR); },
  // Whitecaps through the Beaufort scale at the near camera, and a storm's close up.
  wind6: async () => { await battle({ wind: 6 }); look(...NEAR); },
  wind12: async () => { await battle({ wind: 12 }); look(...NEAR); },
  gale: async () => { await battle({ wind: 15 }); look(...NEAR); },
  wind18: async () => { await battle({ wind: 18 }); look(...NEAR); },
  wind30: async () => { await battle({ wind: 30 }); look(...NEAR); },
  stormClose: async () => { await battle({ wind: 25 }); look([120, 40, 150], [0, 0, 0], 50); },
  dusk: async () => { await battle({ hours: 17.8 }); look(...WIDE); },
  night: async () => { await battle({ hours: 0 }); look(...NEAR); },
  islands: async () => {
    await battle({ map: 'pacific-islands' });
    const island = game.simulation.islands[0];
    look([island.x + island.rx * 1.25, Math.max(180, island.height * .32), island.z + island.rz * .65], [island.x, island.height * .28, island.z], 60);
  },
  zoom5km: async () => { await battle({ range: 5000 }); look([0, 29, 0], [5000, 14, 0], zoom(24)); },
  zoom20km: async () => { await battle({ range: 20000 }); look([0, 29, 0], [20000, 14, 0], zoom(24)); },
  air: async () => { await battle(); look([0, 2600, 2400], [0, 0, -1800], 52); },
  submerged: async ({ depth = 30, mode = 'Chase' } = {}) => {
    await battle({ player: 'type-viic' });
    game.rig.update = rigUpdate;
    if (game.targetView) game.targetView.root.visible = false;
    const motion = game.simulation.ship;
    place(game.playerView, { x: 0, y: -depth, z: 0, heading: 0, pitch: 0, roll: 0 });
    game.ship.position.copy(game.playerView.root.position);
    game.rig.setSubmarine(game.definition.submarine);
    game.rig.mode = mode; game.rig.binoculars = false; game.rig.azimuth = .82;
    game.rig.update(motion, motion.y, 0, true);
  },
  sub7: async () => scenes.submerged({ depth: 7 }),
  sub50: async () => scenes.submerged({ depth: 50 }),
  periscope: async () => scenes.submerged({ depth: 7, mode: 'Bridge' }),
  /** Ninety seconds at full ahead from rest, then a stern chase view of the trail. */
  wake: async () => {
    await battle({ range: 15000 });
    game.rig.update = rigUpdate;
    const sample = game.input.sample.bind(game.input);
    game.input.sample = () => ({ ...sample(), throttle: 1, rudder: 0 });
    game.setPaused(false);
    // Yield a task per frame so the simulation worker's replies land between frames.
    try { for (let i = 0; i < 900; i++) { await new Promise(requestAnimationFrame); await game.frame(game.lastTime + 100); } }
    finally { game.input.sample = sample; game.setPaused(true); }
    const ship = game.simulation.ship;
    wakeState = { x: ship.x, z: ship.z, heading: ship.heading, speed: ship.speed };
    const back = [-Math.sin(ship.heading), Math.cos(ship.heading)];
    look([ship.x + back[0] * 520 - back[1] * 220, 120, ship.z + back[1] * 520 + back[0] * 220], [ship.x + back[0] * 120, 0, ship.z + back[1] * 120], 55);
  },
};

async function capture() {
  await game.frame(performance.now());
  await game.renderer.backend.device.queue.onSubmittedWorkDone();
  return game.renderer.domElement.toDataURL('image/png');
}
/** Serialised CPU + GPU cost of whole frames: each frame waits for the GPU before the next. */
async function measure(count = 120, stepping = true) {
  const device = game.renderer.backend.device;
  game.setPaused(!stepping);
  const times = [];
  try {
    for (let i = 0; i < count + 10; i++) {
      const start = performance.now();
      await game.frame(game.lastTime + 1000 / 60);
      await device.queue.onSubmittedWorkDone();
      if (i >= 10) times.push(performance.now() - start);
    }
  } finally { game.setPaused(true); }
  times.sort((a, b) => a - b);
  const mean = times.reduce((sum, t) => sum + t, 0) / times.length;
  return { mean, median: times[times.length >> 1], p90: times[Math.floor(times.length * .9)], calls: game.renderer.info.render.calls, triangles: game.renderer.info.render.triangles };
}

window.oceanReview = {
  game, scenes: Object.keys(scenes), errors,
  async scene(name) { output.textContent = name; await scenes[name](); await settle(); output.textContent = ''; return { name, errors: [...errors], ...(name === 'wake' ? { wakeState } : {}) }; },
  capture, measure,
};
window.ready = true; output.textContent = '';
</script>
</html>
