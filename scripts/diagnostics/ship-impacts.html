<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shell marks · runtime review</title>
<style>
  html,body{margin:0;background:#132d38;color:#edf1ec;font:14px sans-serif}
  #scene{width:1280px;height:720px}canvas{display:block}
  #status{position:fixed;left:20px;top:20px;max-width:800px;background:#132d38;padding:10px}
</style>
<div id="scene"></div><output id="status">Preparing ship impact review…</output>
<script type="module">
import { Game } from '/src/game/Game.ts';
import { hitShip } from '/src/simulation/damage.ts';
import { localToWorld } from '/src/simulation/geometry.ts';

// Isolated developer fixture: real CPU collision outcomes and the production ship,
// ocean, lighting and decal adapter. HE here exercises visuals only; playable guns fire AP.
const status = document.querySelector('#status');
let ready;
const loaded = new Promise(resolve => ready = resolve);
const game = new Game(document.querySelector('#scene'), {quality:'medium',sea:'Fair',resolution:1}, {
  progress: label => status.textContent=label, ready,
  telemetry:()=>{},pause:()=>{},hud:()=>{},error:message=>{status.textContent=message;window.reviewError=message;},
});
game.start(); await loaded;
game.setInPort(false); game.setPaused(true); game.rig.update=()=>{};
let sequence=0;
function fire(from,to,caliberM,penetrationMm,type='AP') {
  const pose=game.simulation.player.motion, events=[];
  const a=localToWorld(from,pose),b=localToWorld(to,pose);
  const velocity=b.map((n,i)=>(n-a[i])*10);
  const shell={id:++sequence,ownerId:'target',position:a,velocity,age:1,penetrationMm,damage:70,caliberM,type,visited:[]};
  hitShip(shell,a,b,game.simulation.player,game.definition,e=>events.push({...e,sequence:++sequence,tick:1}));
  game.playerView.impactMarks.update(events,'player');
  return events;
}
function prepare() {
  game.simulation.reset(); game.effects.reset(); sequence=0;
  game.simulation.player.motion.x=0; game.playerView.snap(); game.targetView.root.visible=false;
  const events=[];
  for(const [z,caliber,budget,type] of [[-18,.15,50,'AP'],[-10,.38,50,'AP'],[-2,.38,1500,'AP'],[6,.46,1500,'AP'],[14,.38,50,'HE']]) {
    events.push(...fire([45,2,z],[-45,2,z],caliber,budget,type));
  }
  events.push(...fire([18,3,20],[13,3,62],.38,500));
  game.camera.fov=45; game.camera.position.set(64,13,15); game.camera.lookAt(15,2,0);
  game.camera.updateProjectionMatrix(); game.camera.updateMatrixWorld();
  status.hidden=true;
  return {marks:game.playerView.impactMarks.count,draws:game.playerView.impactMarks.drawCalls,
    events:events.filter(e=>e.impact).map(e=>({kind:e.kind,position:e.impact.position,normal:e.impact.normal,type:e.shell.type,caliber:e.shell.caliberM}))};
}
async function still() {
  // PassNode caches per animation frame: an immediate second pipeline.render()
  // can return the previous camera/aspect. Let the actual game render settle.
  for(let i=0;i<2;i++) { await new Promise(requestAnimationFrame); await game.frameTask; }
  game.pipeline.render();
  return game.renderer.domElement.toDataURL('image/png');
}
async function checkSmokeOcclusion() {
  prepare();
  const marks=game.playerView.impactMarks, smoke=game.effects.smoke;
  // Freeze one production smoke volume in front of the scars, independent of
  // muzzle direction and random battle timing. Leave its normal draw order intact.
  const plume=smoke.emit(game.camera.position.clone().set(36,6,5));
  Object.assign(plume,{size:38,life:20,age:1,density:30,opacity:1});
  plume.color.set('#b9b6ae');
  smoke.update(0,game.camera,game.effects.wind);
  async function pixels(showMarks,showSmoke) {
    marks.setVisible(showMarks); smoke.mesh.visible=showSmoke;
    const image=new Image(); image.src=await still(); await image.decode();
    const canvas=document.createElement('canvas'); canvas.width=image.width; canvas.height=image.height;
    const context=canvas.getContext('2d'); context.drawImage(image,0,0);
    return context.getImageData(0,0,canvas.width,canvas.height).data;
  }
  try {
    const clear=await pixels(false,false), marked=await pixels(true,false);
    const smokeOnly=await pixels(false,true), smokyMarks=await pixels(true,true);
    plume.position.x=-36; smoke.update(0,game.camera,game.effects.wind);
    const rearSmoke=await pixels(false,true), rearMarks=await pixels(true,true);
    let clearDifference=0, smokyDifference=0, rearDifference=0, samples=0;
    for(let i=0;i<clear.length;i+=4) {
      const difference=Math.abs(clear[i]-marked[i])+Math.abs(clear[i+1]-marked[i+1])+Math.abs(clear[i+2]-marked[i+2]);
      if(difference<60) continue;
      samples++; clearDifference+=difference;
      smokyDifference+=Math.abs(smokeOnly[i]-smokyMarks[i])+Math.abs(smokeOnly[i+1]-smokyMarks[i+1])+Math.abs(smokeOnly[i+2]-smokyMarks[i+2]);
      rearDifference+=Math.abs(rearSmoke[i]-rearMarks[i])+Math.abs(rearSmoke[i+1]-rearMarks[i+1])+Math.abs(rearSmoke[i+2]-rearMarks[i+2]);
    }
    const contrastRatio=smokyDifference/Math.max(1,clearDifference);
    const rearContrastRatio=rearDifference/Math.max(1,clearDifference);
    return {pass:samples>20&&contrastRatio<.2&&rearContrastRatio>.8,samples,contrastRatio,rearContrastRatio};
  } finally {
    plume.position.x=36; smoke.update(0,game.camera,game.effects.wind);
    marks.setVisible(true); smoke.mesh.visible=true;
  }
}
window.impactReview={game,fire,prepare,still,checkSmokeOcclusion,initial:prepare()};
</script>
</html>
