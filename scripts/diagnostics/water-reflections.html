<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Distant ship reflections · runtime review</title>
<style>
  body{margin:0;background:#132d38;color:#edf1ec;font:14px sans-serif}
  #scene{width:1280px;height:720px}canvas{display:block}
  #status{position:fixed;left:16px;top:16px;background:#132d38;padding:8px}
</style>
<div id="scene"></div><output id="status">Preparing reflection review…</output>
<script type="module">
import { Game } from '/src/game/Game.ts';
import { GRAPHICS_PRESETS } from '/src/game/graphicsSettings.ts';

// Real game renderer, model, ocean and post-processing, with a stationary target seen through the
// binoculars. The ocean traces screen-space ship reflections inside its surface shading (High and
// Ultra); WaterViewFocus stretches their reach to the hull under the lens and moves the sun's shadow
// anchor onto it. A frame traced and the same frame untraced isolate what the reflections draw.
// ?legacy=1 keeps the base reach and the player's shadow anchor, ?calm=1 flattens the sea,
// ?range=, ?zoom= and ?quality= set the view, ?test=1 runs the check.
const params = new URLSearchParams(location.search);
const status = document.querySelector('#status');
const game = new Game(document.querySelector('#scene'), (GRAPHICS_PRESETS[params.get('quality')] ?? GRAPHICS_PRESETS.high), {
  progress:label=>status.textContent=label,ready:()=>{},telemetry:()=>{},pause:()=>{},hud:()=>{},
  error:message=>{status.textContent=message;window.reviewError=message;},
});
game.scheduleFrame=()=>{};game.start(); await game.initialization;
if(window.reviewError) throw new Error(window.reviewError);
game.setInPort(false); game.setPaused(true);
game.rig.update=()=>{}; game.rig.binoculars=true;
function prepare(range=5000,magnification=24) {
  Object.assign(game.simulation.target.motion,{x:range,z:0,heading:0});
  game.targetView.snap(); game.targetView.root.visible=true;
  game.camera.fov=2*Math.atan(Math.tan(52*Math.PI/360)/magnification)*180/Math.PI;
  game.camera.position.set(0,29,0); game.camera.lookAt(range,14,0);
  game.camera.updateProjectionMatrix(); game.camera.updateMatrixWorld();
  return {range,magnification};
}
async function still() {
  // PassNode caches once per renderer animation frame. Explicitly advance that
  // clock for background-tab captures so a camera change cannot return old pixels.
  for(let i=0;i<2;i++) {
    game.renderer._nodes.nodeFrame.update();
    await game.frame(performance.now());
  }
  // Present the prepared post-process textures and capture synchronously.
  game.pipeline.render();
  return game.renderer.domElement.toDataURL('image/png');
}
async function pixels() {
  const image=new Image();image.src=await still();await image.decode();
  const canvas=document.createElement('canvas');canvas.width=image.width;canvas.height=image.height;
  const context=canvas.getContext('2d');context.drawImage(image,0,0);return context.getImageData(0,0,image.width,image.height).data;
}

const ocean=game.ocean,reflections=ocean.reflections,focus=game.waterViewFocus,baseDistance=reflections.maxDistance;
/** The tier's base reach and the player's shadow anchor, as without the focus. */
const legacyFocus={update:()=>{reflections.maxDistance=baseDistance;return undefined;}};
if(params.has('legacy')) game.waterViewFocus=legacyFocus;
if(params.has('calm')) {ocean.waves.significantHeight=0;ocean.waves.dirty=true;}
// Paused frames never advance the ocean's clock, so every capture shows the same sea.
ocean.time=60;
prepare(Number(params.get('range')??5000),Number(params.get('zoom')??24));await still();status.hidden=true;

function measure() {
  return {range:reflections.maxDistance,steps:reflections.steps,shadow:game.environment.sunLight.target.position.toArray()};
}
/** Pixels the reflections change: the same frozen frame traced and untraced. */
async function reflected() {
  const enabled=reflections.screenSpace;
  try {
    reflections.screenSpace=true;const traced=await pixels();
    reflections.screenSpace=false;const plain=await pixels();
    let pixelsChanged=0,change=0;
    for(let i=0;i<traced.length;i+=4) {
      const delta=Math.abs(traced[i]-plain[i])+Math.abs(traced[i+1]-plain[i+1])+Math.abs(traced[i+2]-plain[i+2]);
      if(delta>6){pixelsChanged++;change+=delta;}
    }
    return {pixelsChanged,change};
  } finally {reflections.screenSpace=enabled;}
}
async function check() {
  if(!reflections.steps) return {passed:false,reason:'This ocean tier traces no ship reflections; use ?quality=high or ultra.'};
  const cases=[];
  for(const range of [5000,20000]) {
    prepare(range,24);
    game.waterViewFocus=legacyFocus;await still();const legacy={...measure(),...await reflected()};
    game.waterViewFocus=focus;await still();const zoomed={...measure(),...await reflected()};
    // The base reach already mirrors the hull's lower edge; the focused reach must mirror at least twice as much.
    cases.push({range,legacy,zoomed,passed:zoomed.pixelsChanged>legacy.pixelsChanged*2+100&&zoomed.range>baseDistance&&zoomed.shadow[0]===range});
  }
  prepare(5000,1);await still();const restored=measure();
  const passed=cases.every(c=>c.passed)&&restored.range===baseDistance&&restored.shadow[0]===game.ship.position.x;
  prepare(Number(params.get('range')??5000),Number(params.get('zoom')??24));await still();
  return {passed,cases,restored};
}
window.reflectionReview={game,prepare,still,measure,reflected,focus,check};
window.reflectionResult=measure();
if(params.has('test')) window.reflectionResult=await check();
window.reflectionDone=true;
</script></html>
