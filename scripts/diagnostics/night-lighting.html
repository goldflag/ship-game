<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Night and sunrise lighting review</title>
<style>html,body{margin:0;background:#10232e}#scene{width:1600px;height:900px}canvas{display:block}output{position:fixed;top:8px;left:8px;color:white;background:#10232e;padding:8px;font:14px sans-serif}</style>
<div id="scene"></div><output>Loading lighting review…</output>
<script type="module">
import { Game } from '/src/game/Game.ts';
import { GRAPHICS_PRESETS } from '/src/game/graphicsSettings.ts';
const output = document.querySelector('output'), noop = () => {};
window.errors = [];
addEventListener('error', e => errors.push(e.message));
addEventListener('unhandledrejection', e => errors.push(String(e.reason)));
const game = new Game(document.querySelector('#scene'), { ...GRAPHICS_PRESETS.high, renderScale: 100 / Math.min(devicePixelRatio, 1.5) }, {
  progress: text => output.textContent = text, ready: noop, telemetry: noop, pause: noop, hud: noop, error: message => errors.push(message),
});
window.game = game;
game.scheduleFrame = noop;
game.setInPort(true); game.start(); await game.initialization;
await game.prepareBattle({ playerShipId: 'bismarck', friendlyBots: [], enemies: ['bismarck'], spawnDistance: 5000, mapId: 'north-atlantic' });
game.setInPort(false); game.setPaused(true); game.rig.releasePointer(); game.rig.update = noop;
// Paused frames never advance the ocean's clock, so every review shows the same sea.
game.ocean.time = 60;
window.reviewLighting = async (hours, options = {}) => {
  game.environment.setBattle({ weather: options.weather ?? 'map', timeOfDay: 'map',
    conditions: { timeHours: hours, ...(options.cloudCover === undefined ? {} : { cloudCover: options.cloudCover }) } });
  game.setInPort(options.port ?? false); game.setPaused(true);
  // Exercise normal scene/condition application, including original palette restoration.
  game.environment.setScene(game.simulation.mapId, options.port ?? false);
  game.camera.position.set(...(options.wide ? [550, 200, 700] : [300, 95, 350]));
  game.camera.lookAt(...(options.wide ? [-650, 75, -1000] : [0, 20, 0]));
  game.camera.fov = 60; game.camera.updateProjectionMatrix(); game.camera.updateMatrixWorld();
  game.sky.pipeline.cloudTemporal.invalidateHistory();
  for (let i = 0; i < 40; i++) await game.frame(performance.now());
  const { sky, ocean } = game;
  // The ocean shades with the same celestial light the scene light carries.
  const light = ocean.sun, sceneLight = game.environment.sunLight;
  // Private baker inspection is pinned to the retained Sky Pro 2.2.0 bundle.
  const cloudFill = sky.pipeline._ambientSky.zenithRadiance.value.toArray();
  const result = { hours, options, sun: sky.sun.intensity.value, elevation: sky.sun.elevationDeg,
    waterLight: light.intensity, sceneLight: sceneLight.intensity,
    direction: light.direction.toArray(), ambient: game.environment.ambientLight.intensity,
    fog: ocean.fog.color.getHexString(), cloudFill, waterColor: ocean.colors.waterColor.toArray(),
    foam: ocean.foam.crest.color.toArray(), errors: [...errors] };
  const night = !options.port && (hours === 0 || hours === 24);
  result.passed = Math.abs(result.waterLight - result.sceneLight) < 1e-8
    && (!night || (result.waterLight > .3 && cloudFill.every(x => x > .005) && result.fog === '182839'))
    && errors.length === 0;
  output.textContent = `${hours}:00 · ${options.weather ?? 'map'} · ${result.passed ? 'PASS' : 'FAIL'}`;
  window.lightingResult = result;
  return result;
};
window.captureLighting = async () => {
  await game.frame(performance.now());
  await game.renderer.backend.device.queue.onSubmittedWorkDone();
  return game.renderer.domElement.toDataURL('image/png');
};
await reviewLighting(0);
window.ready = true;
</script>
</html>
