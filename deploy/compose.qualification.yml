# Isolated test stack: no edge-network membership and no public listening port.
services:
  postgres:
    mem_limit: 384m
  api:
    mem_limit: 512m
    environment:
      AUTH_ORIGIN: http://qualification.test:8080
  server:
    mem_limit: 1g
    environment:
      NAVAL_ORIGIN: http://qualification.test:8080
      NAVAL_TRUSTED_PROXIES: 172.30.79.2
    networks:
      simulation:
        ipv4_address: 172.30.79.3
  web:
    networks: !override
      simulation:
        ipv4_address: 172.30.79.2
    ports: [127.0.0.1:18780:8080]
networks:
  simulation:
    internal: false
    ipam:
      config: !override
        - subnet: 172.30.79.0/24
          ip_range: 172.30.79.128/25
  edge: !reset null
