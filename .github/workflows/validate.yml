name: Validate game and Rust multiplayer
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    # A full run took about 53 minutes, 31 of them linking the Rust test binaries in release (thin LTO, one codegen
    # unit); multiplayer:check now tests on the ci-test profile instead. rust-cache keeps dependencies, but the workspace
    # crates still rebuild for the tests and again in release for the server smoke. Headroom for a slow runner.
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: ships_admin
          POSTGRES_PASSWORD: ci-admin
          POSTGRES_DB: ships
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ships_admin -d ships"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPASSWORD: ci-admin
      POSTGRES_USER: ships_admin
      POSTGRES_DB: ships
      API_DB_PASSWORD: ci-api
      BATTLE_DB_PASSWORD: ci-battle
      MIGRATION_DB_PASSWORD: ci-migration
      MIGRATION_DATABASE_URL: postgres://ships_migration:ci-migration@127.0.0.1:5432/ships
      API_DATABASE_URL: postgres://ships_api:ci-api@127.0.0.1:5432/ships
      BATTLE_DATABASE_URL: postgres://ships_battle:ci-battle@127.0.0.1:5432/ships
      TEST_API_DATABASE_URL: postgres://ships_api:ci-api@127.0.0.1:5432/ships
      TEST_ADMIN_DATABASE_URL: postgres://ships_admin:ci-admin@127.0.0.1:5432/ships
      AUTH_ORIGIN: http://127.0.0.1:4173
      NAVAL_ORIGIN: http://127.0.0.1:4173
      NAVAL_TEST_URL: http://127.0.0.1:4173
      ACCOUNTS_URL: http://127.0.0.1:8788
      SERVICE_SECRET: ci-only-service-secret-at-least-32-characters
      BETTER_AUTH_SECRET: ci-only-auth-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - name: Install pinned Rust toolchain
        run: rustup show
      # Caches target/ and ~/.cargo (including the wasm-bindgen binary below), keyed on the toolchain and Cargo.lock;
      # saved even when a later step fails, so one red test doesn't leave the next run to rebuild the workspace cold.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install WASM bindings
        run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - run: bun install --frozen-lockfile
      - name: Initialize isolated account database
        run: |
          sh services/db/init.sh
          bun run accounts:migrate
          bun run accounts:check
      - run: bun run multiplayer:check
      # The TypeScript tests run even when multiplayer:check fails: `bun run check` and `bun run master:red` read this
      # run's failures as master's baseline, and a skipped step would leave them unknown.
      # The native construction compiler the authoring and construction tests run, built here rather than inside a test's timeout.
      - name: Build the native construction compiler
        if: ${{ !cancelled() }}
        run: cargo build --locked --profile wasm-dev -p naval-sim --example compile_construction
      - run: bun run test
        if: ${{ !cancelled() }}
      - run: bun run build
      - name: Exercise the release server over HTTP and WebSockets
        run: |
          cargo build --release --locked -p naval-server --bin naval-server
          cargo build --release --locked -p naval-sim --example compile_construction
          # The test refuses a URL without "_test" in it; this container's database is disposable, and the application name says so.
          POSTGRES_TEST_URL="$BATTLE_DATABASE_URL?application_name=naval_ci_test" cargo test --profile ci-test -p naval-server ordered_postgres_flush_terminal_immutability_and_restart_abort -- --ignored
          bun services/api/main.ts > /tmp/naval-api.log 2>&1 &
          naval_api_pid=$!
          bun services/compiler/worker.ts > /tmp/naval-compiler.log 2>&1 &
          naval_compiler_pid=$!
          target/release/naval-server > /tmp/naval-server.log 2>&1 &
          naval_ci_pid=$!
          bunx vite --host 127.0.0.1 --port 4173 > /tmp/naval-vite.log 2>&1 &
          naval_web_pid=$!
          trap 'kill -TERM "$naval_ci_pid" "$naval_api_pid" "$naval_compiler_pid" "$naval_web_pid" 2>/dev/null || true; wait || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/api/health && curl --fail --silent http://127.0.0.1:8788/health; then break; fi
            sleep 1
          done
          bun run multiplayer:smoke
          bun scripts/multiplayer/custom-smoke.ts
          bun scripts/multiplayer/session-smoke.ts
