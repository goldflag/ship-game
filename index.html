<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#122b35" />
    <meta name="description" content="Choose your fleets and take the helm in a singleplayer naval custom battle." />
    <title>Fleet Command — Custom Battle</title>
  </head>
  <body>
    <div id="root">
      <section class="startup-screen" aria-label="Opening the harbor" style="--p: 0.01">
        <div class="startup-drawing" role="progressbar" aria-label="Loading progress" aria-valuetext="Loading game files" aria-valuenow="1" aria-valuemin="0" aria-valuemax="100"><span class="startup-pen"></span></div>
        <p class="startup-status" role="status">Loading game files…</p>
        <noscript><p class="startup-status">Enable JavaScript, then reload to play Fleet Command.</p></noscript>
      </section>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
