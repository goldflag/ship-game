[workspace]
members = ["crates/naval-sim", "crates/naval-protocol", "crates/naval-server", "crates/naval-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
sha2 = "0.10"
naval-sim = { path = "crates/naval-sim" }
naval-protocol = { path = "crates/naval-protocol" }

[profile.release]
lto = "thin"
codegen-units = 1

# Keep editor compilation fast at runtime; incremental compilation and skipping
# LTO still shorten local rebuilds compared with the release profile.
[profile.wasm-dev]
inherits = "release"
opt-level = 3
lto = "off"
codegen-units = 16
incremental = true

# The agent/developer edit-test loop (`bun run rust:test`). Release semantics, so
# numerical scenarios stay within their budgets, without the thin-LTO single-unit
# link that makes every cycle minutes long. CI keeps testing `--release`.
[profile.test-fast]
inherits = "release"
opt-level = 1
lto = "off"
codegen-units = 16
incremental = true
