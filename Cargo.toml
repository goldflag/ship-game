[workspace]
members = ["crates/naval-sim", "crates/naval-protocol", "crates/naval-server", "crates/naval-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
sha2 = "0.10"
naval-sim = { path = "crates/naval-sim" }
naval-protocol = { path = "crates/naval-protocol" }

[profile.release]
lto = "thin"
codegen-units = 1
