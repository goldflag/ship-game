<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="Design prototype: three interactive workflow variations for PvE fleet command in Fleet Command. Illustrative battle state; nothing here is implemented.">
<title>PvE fleet command · UI studies</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap">
<style>
/* PvE fleet command UI studies. Extends the game's naval instrument styling (DESIGN.md):
   ivory/muted text over dark maritime blue, brass commands, mint readiness, salmon hostiles,
   Barlow controls, Barlow Condensed headings/readings, fine borders, 1–3 px corners. */
:root{
  --ivory:#edf1ec; --text:#f0f5f3; --muted:#bacbd0; --muted2:#93a7ad; --brass:#e0c58d; --brass-hi:#efd5a0; --ink:#152b32;
  --maritime:#132d38; --field:#0e2530; --field-t:#0e2530cc; --field-t2:#0e253099; --line:#cfdfdf35; --line2:#c9dce04a; --line3:#c0d4d24a;
  --mint:#86e4c5; --mint-dim:#86e4c599; --gold:#e8c56c; --salmon:#ffb5a6; --salmon2:#ff9c8d; --land:#65786a; --land-line:#b3c5af;
  --shadow:0 2px 4px #07131bea; --r1:1px; --r2:2px; --r3:3px;
  --proto:#f2e9d6; --proto-ink:#2a2620; --proto-line:#b9a97f;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;min-height:100dvh;background:#0b1c25;color:var(--ivory);font:13px/1.35 'Barlow','Barlow Fallback',system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:transparent;border:1px solid var(--line);border-radius:var(--r3);padding:6px 9px;min-height:30px;touch-action:manipulation}
button:disabled{opacity:.42;cursor:default}
button svg{flex-shrink:0}
kbd{font:500 10px/1.2 'Barlow Condensed',sans-serif;min-width:17px;padding:1px 4px;border:1px solid var(--line3);border-radius:2px;display:inline-flex;align-items:center;justify-content:center;color:#e1e9e8}
h1,h2,h3,h4{margin:0;font-family:'Barlow Condensed','Barlow Condensed Fallback','Arial Narrow',sans-serif;font-weight:500;line-height:1.1}
small{font-size:11px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.num{font-family:'Barlow Condensed',sans-serif;font-weight:500}
[hidden]{display:none!important}

/* ---------- Prototype frame (not part of the proposed game UI) ---------- */
.proto{background:var(--proto);color:var(--proto-ink);border-bottom:2px solid var(--proto-line);font-family:'Barlow',sans-serif;position:relative;z-index:5}
.proto::before{content:'';position:absolute;left:0;right:0;top:0;height:4px;background:repeating-linear-gradient(-45deg,#8a7a4f 0 8px,#f2e9d6 8px 16px)}
.proto-row{display:flex;align-items:center;gap:10px;padding:10px 14px 8px;flex-wrap:wrap}
.proto-row+.proto-row{padding-top:0}
.proto h1{font-size:19px;letter-spacing:.01em;color:#1e1b16;margin-right:4px;white-space:nowrap}
.proto h1 span{color:#6f6141;font-weight:400;font-family:'Barlow',sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-left:10px;vertical-align:middle}
.proto .tag{font-size:10px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--proto-line);border-radius:2px;padding:3px 7px;color:#5d5136;white-space:nowrap}
.proto button{border-color:#b9a97f;color:#2a2620;background:#fbf6ea;border-radius:2px;min-height:28px;padding:4px 10px;font-size:12px}
.proto button:hover{background:#fff}
.proto button[aria-pressed=true]{background:#2a2620;color:#f6efe0;border-color:#2a2620}
.proto button:focus-visible{outline:2px solid #2a2620;outline-offset:2px}
.proto .seg{display:inline-flex;border:1px solid #b9a97f;border-radius:2px;overflow:hidden}
.proto .seg button{border:0;border-radius:0;border-right:1px solid #b9a97f;min-width:0}
.proto .seg button:last-child{border-right:0}
.proto .seg button b{font-weight:600;margin-right:6px;color:#8a7a4f}
.proto .seg button[aria-pressed=true] b{color:#e0c58d}
.proto label{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:#5d5136;letter-spacing:.06em;text-transform:uppercase}
.proto select{font:12px 'Barlow',sans-serif;color:#2a2620;background:#fbf6ea;border:1px solid #b9a97f;border-radius:2px;padding:4px 8px;min-height:28px}
.proto .grow{flex:1}
.proto .note{font-size:11px;color:#6f6141;max-width:520px}
.proto .tabs{display:inline-flex;gap:4px;flex-wrap:wrap}
.proto .tabs button{padding:4px 9px}
.proto .tabs button i{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid #8a7a4f;font:600 9px/12px 'Barlow',sans-serif;text-align:center;margin-right:6px;font-style:normal;color:#8a7a4f}
.proto .tabs button[aria-pressed=true] i{border-color:#e0c58d;color:#e0c58d}

/* ---------- Stage & game viewport ---------- */
.stage{position:relative;flex:1;min-height:420px}
.game{position:absolute;inset:0;overflow:hidden;color:var(--text);font-size:12px;text-shadow:var(--shadow);
  background:radial-gradient(120% 90% at 50% 40%,#1d4a5a 0%,#153744 42%,#0f2a36 72%,#0b1f2a 100%);container:game/size}
.game.is-paused .map-wrap{filter:saturate(.75) brightness(.86)}
.game button{text-shadow:inherit}
.game button:hover:not(:disabled){border-color:var(--mint);color:var(--mint)}
.game button:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
.game button[aria-pressed=true]{color:var(--gold);border-color:var(--gold)}
.game .primary{background:var(--brass);color:var(--ink);border-color:var(--brass);text-shadow:none;font-weight:500}
.game .primary:hover:not(:disabled){background:var(--brass-hi);color:var(--ink);border-color:var(--brass-hi)}
.game .danger{color:var(--salmon);border-color:#ffb5a655}
.game .quiet{border-color:transparent;color:var(--muted)}
.game .quiet:hover:not(:disabled){border-color:var(--line)}
.game .caption{position:absolute;right:10px;bottom:6px;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#bacbd099;pointer-events:none;z-index:3}
.map-wrap{position:absolute;inset:0}
.map-wrap > svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.map-wrap > svg.arming{cursor:crosshair}
.map-wrap > svg.placing{cursor:copy}

/* Map symbols */
.sea-outside{fill:#05121a;fill-opacity:.42}
.boundary{fill:none;stroke:#edf1ec;stroke-opacity:.7;stroke-width:1.2px;vector-effect:non-scaling-stroke}
.boundary-warn{fill:none;stroke:#e8c56c;stroke-opacity:.35;stroke-width:1px;stroke-dasharray:4 6;vector-effect:non-scaling-stroke}
.legal{fill:#86e4c5;fill-opacity:.07;stroke:#86e4c5;stroke-opacity:.55;stroke-width:1px;stroke-dasharray:6 5;vector-effect:non-scaling-stroke}
.legal-hatch{fill:url(#hatch)}
.land{fill:var(--land);fill-opacity:.78;stroke:var(--land-line);stroke-width:.9px;vector-effect:non-scaling-stroke}
.grid{stroke:#cfdfdf;stroke-opacity:.09;stroke-width:1px;vector-effect:non-scaling-stroke;fill:none}
.grid-label{fill:#bacbd0;fill-opacity:.6;font:10px 'Barlow Condensed',sans-serif}
.approach{fill:none;stroke:#ffb5a6;stroke-opacity:.45;stroke-width:1.2px;stroke-dasharray:2 5;vector-effect:non-scaling-stroke}
.approach-label{fill:#ffb5a6;fill-opacity:.8;font:500 10px 'Barlow',sans-serif;letter-spacing:.1em;text-transform:uppercase}
.map-text{paint-order:stroke;stroke:#07131b;stroke-width:3px;stroke-linejoin:round;fill:currentColor;font:500 10px 'Barlow',sans-serif}
.map-text.small{font-size:9px}
.map-text.num{font-family:'Barlow Condensed',sans-serif;font-size:11px}
.unit{cursor:pointer;color:var(--mint);outline:none}
.unit.is-lost{color:#93a7ad;opacity:.55;cursor:default}
.unit.is-incapable{color:#c9c2a5}
.unit .hull{fill:currentColor;stroke:#07131b;stroke-width:.8px;vector-effect:non-scaling-stroke}
.unit .ring{fill:none;stroke:var(--gold);stroke-width:1.4px;vector-effect:non-scaling-stroke;opacity:0}
.unit.is-selected .ring,.unit:focus-visible .ring{opacity:1}
.unit.is-followed .follow-ring{opacity:1}
.follow-ring{fill:none;stroke:#edf1ec;stroke-width:1px;stroke-dasharray:2 3;vector-effect:non-scaling-stroke;opacity:0}
.unit.is-helm .hull{stroke:var(--brass);stroke-width:2px}
.unit .hp{fill:none;stroke:#c9dce033;stroke-width:3px;vector-effect:non-scaling-stroke}
.unit .hp-fill{fill:none;stroke:currentColor;stroke-width:3px;vector-effect:non-scaling-stroke}
.unit .warn{fill:var(--gold);font:600 9px 'Barlow',sans-serif;paint-order:stroke;stroke:#07131b;stroke-width:3px}
.unit.is-hover .ring{opacity:.6}
.contact{cursor:pointer;color:var(--salmon);outline:none}
.contact.is-lost{color:#d9a59a}
.contact .uncertainty{fill:currentColor;fill-opacity:.06;stroke:currentColor;stroke-opacity:.6;stroke-width:1px;stroke-dasharray:3 4;vector-effect:non-scaling-stroke}
.contact.is-lost .uncertainty{stroke-dasharray:1.5 4}
.contact .mark{fill:none;stroke:currentColor;stroke-width:1.6px;vector-effect:non-scaling-stroke}
.contact .mark-fill{fill:currentColor;stroke:#07131b;stroke-width:.8px;vector-effect:non-scaling-stroke}
.contact .vector{stroke:currentColor;stroke-width:1.2px;vector-effect:non-scaling-stroke;fill:none}
.contact .ring{fill:none;stroke:var(--gold);stroke-width:1.4px;vector-effect:non-scaling-stroke;opacity:0}
.contact.is-selected .ring,.contact:focus-visible .ring,.contact.is-focus .ring{opacity:1}
.airgroup{cursor:pointer;color:var(--mint);outline:none}
.airgroup .plane{fill:currentColor;stroke:#07131b;stroke-width:.7px;vector-effect:non-scaling-stroke}
.airgroup .ring{fill:none;stroke:var(--gold);stroke-width:1.4px;vector-effect:non-scaling-stroke;opacity:0}
.airgroup.is-selected .ring,.airgroup:focus-visible .ring{opacity:1}
.route{fill:none;stroke:var(--gold);stroke-width:1px;stroke-dasharray:5 5;vector-effect:non-scaling-stroke}
.route-dim{fill:none;stroke:#86e4c5;stroke-opacity:.45;stroke-width:1px;stroke-dasharray:3 5;vector-effect:non-scaling-stroke}
.area{fill:#86e4c5;fill-opacity:.05;stroke:#86e4c5;stroke-opacity:.55;stroke-width:1px;stroke-dasharray:4 7;vector-effect:non-scaling-stroke}
.area.is-selected{stroke:var(--gold);stroke-opacity:.9;fill:#e8c56c;fill-opacity:.06}
.slot{stroke:#86e4c5;stroke-opacity:.35;stroke-width:1px;vector-effect:non-scaling-stroke}
.waypoint{fill:none;stroke:var(--gold);stroke-width:1.2px;vector-effect:non-scaling-stroke}
.torp-run{fill:none;stroke:var(--gold);stroke-width:1.5px;vector-effect:non-scaling-stroke}
.ghost{fill:none;stroke:#edf1ec;stroke-opacity:.5;stroke-width:1px;stroke-dasharray:2 3;vector-effect:non-scaling-stroke}
.selbox{fill:#e8c56c1a;stroke:var(--gold);stroke-width:1px;vector-effect:non-scaling-stroke}

/* Shared instruments */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border:1px solid var(--line);border-radius:2px;font-size:11px;white-space:nowrap}
.pill b{font-weight:500;color:var(--mint)}
.pill.helm b{color:var(--brass)}
.pill.cam b{color:#edf1ec}
.pill.warn{color:var(--gold);border-color:#e8c56c66}
.pill.danger{color:var(--salmon);border-color:#ffb5a655}
.clock{display:flex;align-items:center;gap:12px}
.clock strong{font:500 22px/1 'Barlow Condensed',sans-serif}
.clock span{font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.pause-btn{display:inline-flex;align-items:center;gap:8px;min-width:98px;justify-content:center}
.pause-btn.on{color:var(--gold);border-color:var(--gold);background:#e8c56c14}
.paused-banner{position:absolute;top:100px;left:50%;transform:translateX(-50%);font:500 12px 'Barlow',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);padding:5px 12px;border:1px solid #e8c56c88;border-radius:2px;background:#0e253099;z-index:4;pointer-events:none}
.surface{background:var(--field-t);border:1px solid var(--line);border-radius:var(--r2);text-shadow:none}
.surface-2{background:var(--field-t2);border:1px solid var(--line);border-radius:var(--r2);text-shadow:none}
.panel-h{display:flex;align-items:center;gap:8px;padding:7px 10px 6px;border-bottom:1px solid var(--line)}
.panel-h h3{font-size:15px}
.panel-h .spacer{flex:1}
.panel-h small{color:var(--muted);font-size:10px}
.panel-h button{min-height:24px;padding:2px 7px;font-size:10px;border-radius:1px}
.feedback{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;z-index:6;max-width:min(720px,calc(100% - 40px));padding:7px 12px;border:1px solid var(--line);border-radius:2px;background:#0e2530d9;font-size:12px;text-shadow:none;display:flex;gap:10px;align-items:center}
.feedback.ok{border-color:#86e4c588;color:#dff7ee}
.feedback.partial{border-color:#e8c56c88;color:#f5e8c4}
.feedback.reject{border-color:#ffb5a688;color:#ffd9d1}
.feedback .k{font-size:9px;letter-spacing:.14em;text-transform:uppercase;padding:2px 6px;border:1px solid currentColor;border-radius:1px;opacity:.85;white-space:nowrap}
.feedback button{min-height:22px;padding:1px 7px;font-size:10px;margin-left:auto}
.orders{display:flex;flex-wrap:wrap;gap:4px}
.orders button{display:inline-flex;align-items:center;gap:7px;padding:5px 8px;min-height:28px;font-size:11px;border-radius:1px;white-space:nowrap}
.orders button kbd{margin-left:2px;color:var(--muted)}
.orders button svg{width:14px;height:14px}
.orders button[aria-pressed=true]{background:#e8c56c14}
.orders .sep{width:1px;background:var(--line);margin:3px 3px}
.target-pick{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;padding:6px 8px;border:1px dashed #e8c56c88;border-radius:2px;font-size:11px;color:var(--gold)}
.target-pick button{min-height:24px;padding:2px 8px;font-size:11px;color:var(--text)}
.target-pick .cancel{margin-left:auto;color:var(--muted)}
.status-line{font-size:11px;color:var(--muted)}
.status-line b{color:var(--text);font-weight:500}
.status-line .warn{color:var(--gold)}
.status-line .bad{color:var(--salmon)}
.status-line .ok{color:var(--mint)}
.rowlist{list-style:none;margin:0;padding:0}
.rowlist li{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px 10px;padding:5px 8px;border-bottom:1px solid var(--line);cursor:pointer}
.rowlist li:hover{background:#d9eeed10}
.rowlist li[aria-selected=true]{background:#e8c56c12;box-shadow:inset 2px 0 0 var(--gold)}
.rowlist li .nm{font:500 13px 'Barlow Condensed',sans-serif;white-space:nowrap}
.rowlist li .nm small{font:400 10px 'Barlow',sans-serif;color:var(--muted);margin-left:6px}
.rowlist li .task{grid-column:2;font-size:10px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowlist li .task.warn{color:var(--gold)}
.rowlist li .task.bad{color:var(--salmon)}
.rowlist li .hpv{font:500 12px 'Barlow Condensed',sans-serif;color:var(--mint);text-align:right}
.rowlist li.lost{opacity:.5}
.rowlist li.lost .hpv{color:var(--muted)}
.rowlist li .glyph{width:14px;height:14px;color:var(--mint)}
.mini-hp{height:3px;background:#c9dce033;grid-column:1/-1;position:relative;overflow:hidden}
.mini-hp i{position:absolute;inset:0 auto 0 0;background:var(--mint)}
.mini-hp i.low{background:var(--gold)}
.mini-hp i.crit{background:var(--salmon)}
.hdr-sm{font:500 10px 'Barlow',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 8px 3px;display:flex;align-items:center;gap:8px}
.hdr-sm .spacer{flex:1}
.hdr-sm .n{color:var(--text);letter-spacing:0;text-transform:none}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips button{min-height:24px;padding:2px 8px;font-size:10px;border-radius:1px}
.chips button[aria-pressed=true]{color:var(--gold);border-color:var(--gold)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:11px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.excpt{display:grid;gap:5px}
.excpt article{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:6px 8px;border:1px solid var(--line);border-radius:2px;border-left:1px solid var(--gold)}
.excpt article.bad{border-left-color:var(--salmon)}
.excpt article.info{border-left-color:var(--mint)}
.excpt h4{font:500 13px 'Barlow Condensed',sans-serif}
.excpt p{margin:0;font-size:10px;color:var(--muted);grid-column:1}
.excpt .acts{grid-column:1/-1;display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.excpt .acts button{min-height:22px;padding:1px 7px;font-size:10px;border-radius:1px}
.excpt time{font:500 11px 'Barlow Condensed',sans-serif;color:var(--muted);grid-row:1;grid-column:2}

/* Air */
.air-filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.air-cards{display:flex;gap:5px;overflow-x:auto;scrollbar-width:thin;padding:3px 2px 6px}
.acard{position:relative;flex:0 0 96px;width:96px;text-align:left;padding:5px 6px 6px;border:1px solid var(--line);border-radius:1px;display:grid;gap:2px;min-height:0;background:transparent}
.acard[aria-pressed=true]{color:var(--gold);border-color:var(--gold)}
.acard .t{display:flex;justify-content:space-between;align-items:center;gap:4px}
.acard .t strong{font:500 12px 'Barlow Condensed',sans-serif;white-space:nowrap}
.acard .t kbd{font-size:8px;min-width:14px}
.acard img{width:80px;height:36px;object-fit:contain;display:block;margin:0 auto;filter:drop-shadow(0 2px 2px #07131b)}
.acard .st{display:flex;align-items:center;gap:4px;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:14px}
.acard .st svg{width:12px;height:12px}
.acard .cells{display:flex;gap:2px}
.acard .cells i{flex:1;height:3px;background:#a8bcb94a;position:relative;overflow:hidden}
.acard .cells i::before{content:'';position:absolute;inset:0;background:currentColor;transform-origin:left;transform:scaleX(var(--c,1))}
.acard .cells i.dmg{color:var(--gold)}
.acard .cells i.crit{color:var(--salmon)}
.acard .cells i.lost{background:repeating-linear-gradient(45deg,#ffb5a6 0 1px,transparent 1px 3px)}
.acard .cells i.lost::before{display:none}
.acard .n{position:absolute;right:6px;top:22px;font:500 12px 'Barlow Condensed',sans-serif}
.acard .n small{font-size:9px;color:var(--muted)}
.acard.loc-hangar{opacity:.78}
.acard.loc-hangar img{filter:grayscale(.4) brightness(.8) drop-shadow(0 2px 2px #07131b)}
.acard .timer{color:var(--gold)}
.acard .badge{position:absolute;left:6px;top:24px;font:500 8px 'Barlow',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:1px 4px;border:1px solid var(--line);border-radius:1px}
.acard.loc-airborne .badge{color:var(--mint);border-color:#86e4c566}
.acard .badge.warn{color:var(--gold);border-color:#e8c56c66}
.deck{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:11px}
.deck .bar{grid-column:1/-1;height:6px;background:#c9dce02a;position:relative;border-radius:1px;overflow:hidden}
.deck .bar i{position:absolute;top:0;bottom:0;left:0;background:var(--mint)}
.deck .bar i.res{background:repeating-linear-gradient(90deg,var(--gold) 0 3px,transparent 3px 6px);opacity:.9}
.deck .bar.full i{background:var(--gold)}
.deck .q{grid-column:1/-1;display:grid;gap:3px}
.deck .q div{display:flex;justify-content:space-between;gap:8px;font-size:10px;color:var(--muted)}
.deck .q div b{color:var(--text);font-weight:500}
.deck .q div .t{color:var(--gold);font-family:'Barlow Condensed',sans-serif;font-size:11px}
.deck .warn{grid-column:1/-1;color:var(--gold);font-size:10px}
.aircraft-detail{display:grid;gap:4px;font-size:11px}
.aircraft-detail div{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:3px 0;border-bottom:1px solid var(--line)}
.aircraft-detail .cond{height:4px;background:#c9dce033;position:relative;min-width:60px}
.aircraft-detail .cond i{position:absolute;inset:0 auto 0 0;background:var(--mint)}
.aircraft-detail .cond i.dmg{background:var(--gold)}
.aircraft-detail .cond i.crit{background:var(--salmon)}
.aircraft-detail .cond i.lost{background:var(--salmon);opacity:.4}
.aircraft-detail small{color:var(--muted)}

/* Briefing / fleet selection shared */
.brief{font-size:12px}
.brief h2{font-size:26px}
.brief p{margin:6px 0;color:var(--muted);line-height:1.45}
.brief .cond{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--text);font-size:12px}
.brief .cond span{color:var(--muted)}
.brief .intel{border:1px solid var(--line);padding:8px 10px;border-radius:2px;margin-top:8px}
.brief .intel h4{font-size:13px;margin-bottom:3px}
.budget{display:grid;gap:8px}
.budget .b{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:baseline;font-size:11px}
.budget .b label{color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-size:10px}
.budget .b output{font:500 15px/1 'Barlow Condensed',sans-serif;grid-column:3;text-align:right}
.budget .b output small{font:400 10px 'Barlow',sans-serif;color:var(--muted)}
.budget .b .track{grid-column:1/-1;height:5px;background:#c9dce02a;position:relative;overflow:hidden;border-radius:1px}
.budget .b .track i{position:absolute;top:0;bottom:0;left:0;background:var(--mint)}
.budget .b.over .track i{background:var(--salmon)}
.budget .b.over output{color:var(--salmon)}
.budget .b .over-msg{grid-column:1/-1;color:var(--salmon);font-size:11px}
.budget .b .ok-msg{grid-column:1/-1;color:var(--muted);font-size:10px}
.catalog{list-style:none;margin:0;padding:0;overflow:auto;scrollbar-width:thin}
.catalog li{display:grid;grid-template-columns:76px 1fr auto;grid-template-areas:'img name add' 'img meta add';gap:0 10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.catalog img{grid-area:img;width:76px;height:24px;object-fit:contain}
.catalog .nm{grid-area:name;font:500 15px 'Barlow Condensed',sans-serif;white-space:nowrap}
.catalog li{min-width:0}
.catalog .meta{grid-area:meta;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.catalog select{max-width:88px;font-size:11px;color:var(--ivory);background:var(--field);border:1px solid var(--line);border-radius:2px;padding:3px 4px;min-height:26px}
.catalog .add button{white-space:nowrap}
.catalog .add{grid-area:add;display:flex;gap:4px}
.catalog .add button{min-height:26px;padding:2px 8px;font-size:11px}
.roster{list-style:none;margin:0;padding:0;overflow:auto;scrollbar-width:thin}
.roster li{display:grid;grid-template-columns:64px 1fr auto auto;align-items:center;gap:0 10px;padding:5px 0;border-bottom:1px solid var(--line)}
.roster img{width:64px;height:20px;object-fit:contain}
.roster .nm{font:500 14px 'Barlow Condensed',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.roster .nm small{display:block;font:400 10px 'Barlow',sans-serif;color:var(--muted)}
.roster .t{font:500 12px 'Barlow Condensed',sans-serif;color:var(--muted);white-space:nowrap}
.roster .rm{width:26px;height:26px;padding:0;border:0;color:var(--muted);min-height:0}
.roster .rm:hover{color:var(--salmon)}
.roster .flag{color:var(--brass)}
.roster select,.game select{font:11px 'Barlow',sans-serif;color:var(--ivory);background:var(--field);border:1px solid var(--line);border-radius:2px;padding:3px 6px;min-height:26px;text-shadow:none}
.presets{display:flex;flex-wrap:wrap;gap:4px}
.presets button{font-size:11px;min-height:26px;padding:3px 9px;border-radius:1px}
.presets button[aria-pressed=true]{color:var(--gold);border-color:var(--gold)}

/* Results */
.results{display:grid;gap:14px}
.results h2{font-size:34px}
.results h2 small{display:block;font:400 12px 'Barlow',sans-serif;color:var(--muted);margin-top:4px}
.results .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.results .cols>div{border:1px solid var(--line);padding:10px 12px;border-radius:2px}
.results h3{font-size:16px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:baseline}
.results h3 small{font:400 10px 'Barlow',sans-serif;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.results ul{margin:0;padding:0;list-style:none;font-size:11px;display:grid;gap:3px}
.results li{display:flex;justify-content:space-between;gap:10px}
.results li span:last-child{color:var(--muted);text-align:right}
.results .rule{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:8px 10px;border-radius:2px;line-height:1.5}
.results .rule b{color:var(--text);font-weight:500}
.results .acts{display:flex;gap:8px;flex-wrap:wrap}
.results .acts button{min-height:36px;padding:8px 14px;display:inline-flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left}
.results .acts button small{font-size:10px;color:var(--muted);font-weight:400}
.results .acts .primary small{color:#152b32b0}
.results .sub{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:10px;color:var(--muted)}
.results .sub button{min-height:22px;padding:1px 7px;font-size:10px}

/* Follow scene */
.scene{position:absolute;inset:0;background:linear-gradient(180deg,#365f73 0%,#5d8699 30%,#8fb0bd 39.5%,#3f6c7e 40%,#1d4658 60%,#123443 100%);overflow:hidden}
.scene ~ .top-r .pill,.scene ~ .top-r button,.helm-banner .pill,.helm-banner button,.scene .minimap button{background:#0e2530b8}
.helm-banner .row:last-child{color:var(--ivory);text-shadow:0 1px 3px #07131b}
.scene .haze{position:absolute;inset:0;background:radial-gradient(60% 30% at 50% 39%,#ffffff33,transparent 70%)}
.scene .ship-img{position:absolute;left:50%;top:44%;width:min(62%,780px);transform:translate(-50%,-38%);filter:drop-shadow(0 18px 24px #05161f99) saturate(.9);opacity:.96}
.scene .ship-img.helm{top:52%;width:min(70%,880px)}
.scene .sea-lines{position:absolute;left:0;right:0;top:40%;bottom:0;background:repeating-linear-gradient(180deg,transparent 0 22px,#ffffff08 22px 23px);mask-image:linear-gradient(180deg,transparent,black 30%)}
.scene .sight{position:absolute;left:50%;top:50%;width:34px;height:34px;transform:translate(-50%,-50%);color:#edf5f0d9;filter:drop-shadow(0 1px 2px #10232e)}
.scene .sight.off{opacity:.35}
.compass-tape{position:absolute;top:16px;left:50%;transform:translateX(-50%);width:272px;text-align:center;font-size:10px;color:var(--muted)}
.compass-tape .tape{position:relative;height:22px;overflow:hidden;mask-image:linear-gradient(90deg,transparent,black 14%,black 86%,transparent)}
.compass-tape .tape span{position:absolute;top:0;transform:translateX(-50%)}
.compass-tape .tape span::after{content:'';position:absolute;top:15px;left:50%;height:5px;width:1px;background:#cfdfdf66}
.compass-tape .tape .c{color:var(--mint);font-weight:600}
.compass-tape strong{display:block;font:500 20px/1 'Barlow Condensed',sans-serif;color:var(--text);margin-top:4px}
.ship-inst{position:absolute;left:24px;bottom:20px;width:240px}
.ship-inst h2{font-size:20px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline}
.ship-inst h2 span{font:500 16px 'Barlow Condensed',sans-serif;color:var(--mint)}
.ship-inst .track{height:5px;margin-top:6px;background:#c9dce033;position:relative}
.ship-inst .track i{position:absolute;inset:0 auto 0 0;background:var(--mint)}
.ship-inst .nav{display:flex;gap:10px;margin-top:8px;align-items:flex-start}
.ship-inst .dial{width:120px;height:120px;color:#dae8e8;flex-shrink:0}
.ship-inst .dial svg{width:100%;height:100%;display:block}
.ship-inst .eng{flex:1}
.ship-inst .spd{font:500 26px/1 'Barlow Condensed',sans-serif}
.ship-inst .spd small{font:400 11px 'Barlow',sans-serif;color:var(--muted);margin-left:4px}
.ship-inst .tele{display:grid;margin-top:4px}
.ship-inst .tele button{border:0;border-radius:0;background:transparent;color:var(--muted);font:500 15px/1 'Barlow Condensed',sans-serif;text-align:left;padding:2px 6px;min-height:20px;position:relative}
.ship-inst .tele button[aria-pressed=true]{color:var(--mint)}
.ship-inst .tele button[aria-pressed=true]::before{content:'';position:absolute;right:100%;top:50%;transform:translateY(-50%);border:5px solid transparent;border-right-color:#eaf3ed}
.ship-inst .tele button:disabled{opacity:.5}
.ship-inst .rud{display:flex;margin-top:6px;width:180px}
.ship-inst .rud button{flex:1;border:0;border-bottom:1px solid var(--line2);border-radius:0;font:500 13px 'Barlow Condensed',sans-serif;color:var(--muted);padding:2px 0;min-height:24px}
.ship-inst .rud button[aria-pressed=true]{color:var(--mint);border-bottom:2px solid var(--mint)}
.ship-inst .cap{margin-top:6px;font-size:10px;color:var(--muted)}
.ship-inst .cap b{color:var(--brass);font-weight:500}
.helm-banner{position:absolute;top:60px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:3}
.helm-banner .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.minimap{position:absolute;right:0;bottom:0;width:280px;height:280px;background:#0e253066;border-left:1px solid var(--line);border-top:1px solid var(--line)}
.minimap svg{width:100%;height:100%;display:block}
.minimap .lbl{position:absolute;left:8px;top:6px;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.minimap button{position:absolute;right:6px;top:4px;min-height:22px;padding:1px 7px;font-size:10px;border-radius:1px}
.scene .lbl-ship{position:absolute;transform:translate(-50%,-100%);font-size:10px;color:var(--mint);text-align:center;white-space:nowrap}
.scene .lbl-ship i{display:block;height:3px;width:60px;background:#c9dce033;margin:2px auto 0;position:relative}
.scene .lbl-ship i::before{content:'';position:absolute;inset:0 auto 0 0;width:var(--w,100%);background:currentColor}
.scene .lbl-ship.hostile{color:var(--salmon)}

/* Deployment tools */
.deploy-tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.deploy-tools .mode button[aria-pressed=true]{color:var(--gold);border-color:var(--gold)}
.deploy-msg{font-size:11px;color:var(--gold);min-height:14px}
.deploy-msg.bad{color:var(--salmon)}
.deploy-msg.ok{color:var(--mint)}
.opening{display:grid;gap:6px;font-size:11px}
.opening article{border:1px solid var(--line);padding:6px 8px;border-radius:2px;display:grid;grid-template-columns:1fr auto;gap:2px 8px}
.opening h4{font:500 13px 'Barlow Condensed',sans-serif}
.opening p{margin:0;color:var(--muted);font-size:10px;grid-column:1}
.opening select{grid-row:1/3;align-self:center}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:10px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;vertical-align:-1px;margin-right:4px;border-radius:1px}

/* ---------- Variation A: Map-led ---------- */
.va .top-l{position:absolute;left:16px;top:14px;display:flex;gap:8px;align-items:flex-start;z-index:3}
.va .top-c{position:absolute;left:50%;top:14px;transform:translateX(-50%);display:flex;gap:14px;align-items:center;z-index:3}
.va .top-r{position:absolute;right:16px;top:14px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;z-index:3}
.top-r .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.va .drawer{position:absolute;z-index:3;display:flex;flex-direction:column;min-height:0}
.va .drawer.left{left:16px;top:56px;width:272px;max-height:calc(100% - 200px)}
.va .drawer.left .body{overflow:auto;scrollbar-width:thin}

.va .float .who strong{font:500 16px 'Barlow Condensed',sans-serif}
.va .float .who small{color:var(--muted)}
.va .float .stat{margin-top:6px}
.va .float .tail{position:absolute;left:50%;bottom:-7px;width:12px;height:12px;background:var(--field-t);border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.va .exc-line{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.va .fleet-sheet{position:absolute;right:16px;top:56px;width:420px;max-height:calc(100% - 80px);display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto;z-index:3}
.va .fleet-sheet .catalog,.va .fleet-sheet .roster{padding:0 10px}
.va .fleet-sheet .catalog{max-height:34%}
.va .fleet-sheet .roster{min-height:0}

.va .results-sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(860px,calc(100% - 40px));max-height:calc(100% - 40px);overflow:auto;padding:18px 22px;z-index:5}
.va .toast{position:absolute;z-index:3;transform:translate(-50%,-100%);font-size:10px;color:var(--gold);white-space:nowrap;pointer-events:none;padding:2px 6px;border:1px solid #e8c56c66;border-radius:1px;background:#0e253099;text-shadow:none}

/* ---------- Variation B: Task-group-led ---------- */
.vb .col{position:absolute;left:0;top:0;bottom:0;width:318px;display:flex;flex-direction:column;background:var(--field-t);border-right:1px solid var(--line);text-shadow:none;z-index:3}
.vb .col .body{overflow:auto;scrollbar-width:thin;flex:1;padding:6px 8px 12px;display:grid;gap:8px;align-content:start}
.vb .map-wrap{left:318px;right:0}
.vb .map-wrap.with-inbox{right:300px}
.vb .inbox{position:absolute;right:0;top:0;bottom:0;width:300px;display:flex;flex-direction:column;background:var(--field-t2);border-left:1px solid var(--line);text-shadow:none;z-index:3}
.vb .inbox .body{overflow:auto;scrollbar-width:thin;flex:1;padding:8px}
.vb .top-c{position:absolute;left:calc(318px + (100% - 318px - 300px)/2);top:14px;transform:translateX(-50%);display:flex;gap:14px;align-items:center;z-index:3}
.vb .top-c.no-inbox{left:calc(318px + (100% - 318px)/2)}
.vb .top-r{position:absolute;right:316px;top:14px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;z-index:3}
.vb .top-r.no-inbox{right:16px}
.gcard{border:1px solid var(--line);border-radius:2px;display:grid;gap:0}
.gcard.is-selected{border-color:var(--gold)}
.gcard>header{display:flex;align-items:center;gap:8px;padding:7px 8px 6px;cursor:pointer}
.gcard>header h3{font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard>header .cnt{font:500 12px 'Barlow Condensed',sans-serif;color:var(--muted)}
.gcard>header .exc{font:500 10px 'Barlow Condensed',sans-serif;color:var(--gold);border:1px solid #e8c56c66;padding:0 5px;border-radius:1px}
.gcard>header .exc.bad{color:var(--salmon);border-color:#ffb5a666}
.gcard .standing{padding:0 8px 6px;font-size:11px;color:var(--muted)}
.gcard .standing b{color:var(--text);font-weight:500}
.gcard .members{border-top:1px solid var(--line)}
.gcard .members li{grid-template-columns:auto 1fr auto;padding:4px 8px}
.gcard .gorders{padding:6px 8px 8px;border-top:1px solid var(--line)}
.gcard .tabs{display:flex;gap:2px;padding:0 8px;border-top:1px solid var(--line)}
.gcard .tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;min-height:26px;color:var(--muted)}
.gcard .tabs button[aria-pressed=true]{color:var(--gold);border-bottom-color:var(--gold)}
.gcard .air{padding:6px 8px 8px}
.gcard .air .air-cards{padding:3px 0 4px}
.gcard .air .acard{flex-basis:88px;width:88px}
.vb .brief-cols{position:absolute;inset:0;display:grid;grid-template-columns:300px 1fr 1fr 1fr 300px;gap:0;z-index:3}
.vb .brief-cols>*{min-width:0;min-height:0;border-right:1px solid var(--line);background:var(--field-t2);text-shadow:none;display:flex;flex-direction:column}

.vb .brief-cols .gcol .body{flex:1;overflow:auto;scrollbar-width:thin;padding:6px 8px}

.vb .brief-cols .catalog,.vb .brief-cols .roster{padding:0 8px}
.vb .paused-banner{left:calc(318px + (100% - 618px)/2)}.vb .paused-banner.no-inbox{left:calc(318px + (100% - 318px)/2)}
.vb .brief-cols .foot{padding:8px;border-top:1px solid var(--line);display:grid;gap:8px}
.vb .results-sheet{position:absolute;left:318px;right:0;top:0;bottom:0;overflow:auto;padding:24px 28px;z-index:4;background:#0e253099;text-shadow:none}
.vb .results-sheet .results{max-width:900px}

.vc .top-c{position:absolute;left:50%;top:14px;transform:translateX(-50%);display:flex;gap:14px;align-items:center;z-index:3}
.vc .top-r{position:absolute;right:16px;top:14px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;z-index:3}
.vc .cmd.raised{bottom:240px}

.vc .cmd .id img{width:120px;height:36px;object-fit:contain;justify-self:start}
.vc .cmd .id .cam{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}

.vc .air-row{position:absolute;left:16px;right:16px;bottom:16px;z-index:4;padding:6px 10px 8px;display:grid;grid-template-columns:1fr 280px;gap:10px;text-shadow:none}
.vc .air-row .cmd-air{display:grid;gap:6px;align-content:start}
.vc .board{position:absolute;inset:0;display:grid;grid-template-columns:320px minmax(0,1fr) 340px;gap:0;z-index:3}
.vc .board>*{min-width:0;min-height:0;border-right:1px solid var(--line);background:var(--field-t2);text-shadow:none;display:flex;flex-direction:column}
.vc .board>*:last-child{border-right:0}

.vc .results-sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(880px,calc(100% - 40px));max-height:calc(100% - 40px);overflow:auto;padding:18px 22px;z-index:5}
.vc .strip{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:4;padding:8px 10px;display:grid;gap:6px;width:min(920px,calc(100% - 32px));text-shadow:none}

/* Guide (prototype) */
.guide{position:absolute;left:16px;bottom:16px;z-index:9;width:340px;background:var(--proto);color:var(--proto-ink);border:1px solid var(--proto-line);border-radius:2px;padding:10px 12px;font-size:12px;box-shadow:0 10px 30px #04151f66}
.guide::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:repeating-linear-gradient(-45deg,#8a7a4f 0 8px,#f2e9d6 8px 16px)}
.guide h3{font-size:15px;margin:4px 0 6px;display:flex;justify-content:space-between;align-items:center}
.guide h3 small{font:400 10px 'Barlow',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#6f6141}
.guide ol{margin:0;padding:0 0 0 18px;display:grid;gap:5px}
.guide li{color:#6f6141}
.guide li.now{color:#1e1b16;font-weight:500}
.guide li.done{text-decoration:line-through;color:#8a7a4f}
.guide .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.guide button{border-color:#b9a97f;color:#2a2620;background:#fbf6ea;border-radius:2px;min-height:26px;padding:3px 9px;font-size:11px}
.guide button:hover{background:#fff}
.guide p{margin:6px 0 0;font-size:11px;color:#5d5136}
.stage.has-guide .vc .cmd{left:auto;right:16px;transform:none;width:min(920px,calc(100% - 380px))}
.stage.has-guide .va .drawer.left{max-height:calc(100% - 300px)}
#game.vb ~ .guide{left:334px}
[data-guide-hot=true]{box-shadow:0 0 0 2px #e0c58d,0 0 0 6px #e0c58d55!important;animation:hot 1.2s ease-in-out infinite}
@keyframes hot{50%{box-shadow:0 0 0 2px #e0c58d,0 0 0 10px #e0c58d22}}

/* Compare (prototype) */
.compare{position:absolute;inset:0;z-index:12;background:#f2e9d6f2;color:var(--proto-ink);overflow:auto;padding:20px 26px 40px;font-family:'Barlow',sans-serif}
.compare h2{font-size:26px;color:#1e1b16}
.compare h3{font-size:17px;color:#1e1b16;margin-top:14px}
.compare p{max-width:78ch;line-height:1.5;font-size:13px}
.compare table{border-collapse:collapse;width:100%;max-width:1100px;font-size:12px;margin-top:10px}
.compare th,.compare td{border:1px solid #cdbf98;padding:7px 9px;vertical-align:top;text-align:left}
.compare th{background:#e8dcc0;font-weight:600}
.compare td b{font-weight:600}
.compare .rec{border:1px solid #8a7a4f;background:#fbf6ea;padding:12px 14px;max-width:1100px;margin-top:12px}
.compare .rec h3{margin-top:0}
.compare .close{position:absolute;right:20px;top:18px}
.compare button{border:1px solid #b9a97f;background:#fbf6ea;color:#2a2620;border-radius:2px}
.compare .tw{overflow-x:auto}
.compare .good{color:#2f6b45}.compare .bad{color:#9b3b2a}

/* Responsive */
@container game (max-width:1180px){
  .va .drawer.left{width:240px}
  .va .drawer.right{width:270px}
  .va .fleet-sheet{width:380px}
  .va .brief-sheet{width:320px}
  .va .drawer.bottom .body{grid-template-columns:1fr 260px}
  .vb .col{width:290px}.vb .map-wrap{left:290px}.vb .inbox{width:270px}.vb .map-wrap.with-inbox{right:270px}
  .vb .top-c{left:calc(290px + (100% - 290px - 270px)/2)}.vb .top-c.no-inbox{left:calc(290px + (100% - 290px)/2)}.vb .top-r{right:286px}
  .vb .brief-cols{grid-template-columns:270px 1fr 1fr 1fr 270px}
  .vc .roster-tl{width:230px}
  .vc .board{grid-template-columns:290px minmax(0,1fr) 300px}
  .vc .air-row{grid-template-columns:1fr 240px}
  .minimap{width:220px;height:220px}
}
@container game (max-width:1000px){
  .va .drawer.bottom .body{grid-template-columns:1fr}
  .va .fleet-sheet{width:min(380px,calc(100% - 32px));top:auto;bottom:16px;max-height:62%}
  .va .brief-sheet{width:min(320px,calc(100% - 32px));max-height:34%}
  .vb .inbox{display:none}.vb .map-wrap.with-inbox{right:0}.vb .top-c{left:calc(290px + (100% - 290px)/2)}.vb .top-r{right:16px}
  .vb .brief-cols{grid-template-columns:240px 1fr 1fr;grid-template-rows:1fr 1fr}
  .vb .brief-cols>:nth-child(1){grid-row:1/3}
  .vb .brief-cols>:nth-child(5){grid-column:1/-1;grid-row:3;flex-direction:row}
  .vc .roster-tl{max-height:36%}
  .vc .board{grid-template-columns:260px minmax(0,1fr) 260px}
  .vc .air-row{grid-template-columns:1fr}
  .vc .side-r{display:none}
  .compass-tape{width:200px}
  .ship-inst{width:200px}
}
@container game (max-width:760px){
  .va .top-c .clock span{display:none}
  .va .drawer.left{width:200px;max-height:40%}
  .va .drawer.right{width:min(260px,calc(100% - 32px));top:auto;bottom:16px;max-height:52%}
  .va .float{max-width:calc(100% - 32px)}
  .vb .col{width:220px}.vb .map-wrap{left:220px}.vb .top-c{left:calc(220px + (100% - 220px)/2)}
  .vb .brief-cols{grid-template-columns:1fr 1fr;grid-template-rows:auto}
  .vb .brief-cols>*{border-right:0;border-bottom:1px solid var(--line)}
  .vb .brief-cols>:nth-child(1){grid-row:auto;grid-column:1/-1;max-height:32%}
  .vb .brief-cols>:nth-child(5){grid-column:1/-1;flex-direction:column}
  .vc .cmd{grid-template-columns:1fr}
  .vc .cmd .id{border-right:0;border-bottom:1px solid var(--line)}
  .vc .roster-tl{width:200px;max-height:30%}
  .vc .board{grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr}
  .vc .board>:nth-child(1){grid-column:1/-1;max-height:34%}
  .minimap{width:160px;height:160px}
  .ship-inst .dial{display:none}
  .results .cols{grid-template-columns:1fr}
  .proto .note{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.fade{transition:opacity .18s}
.map-wrap{transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .3s}

</style>

<!--
THESIS: One fleet, one contact picture, three command structures. The study compares where orders live (at the unit, in task groups, or on a command card), not colour or type; it refuses the RTS default of a full-width bottom dashboard and a permanent side roster.
OWN-WORLD: The game's own naval instruments: ivory and blue-grey text over dark maritime blue, brass commands, mint readiness, salmon hostiles, Barlow controls and Barlow Condensed readings, fine 1px lines, 1–3px corners, transparent instruments over the sea with one translucent surface per panel.
STORY: A single-ship player learns that captains execute standing orders, that focus fire never pulls an escort off station, and that following or steering a ship is separate from commanding the fleet.
FIRST VIEWPORT: Prototype frame on drafting paper on top; the game viewport below opens on variation A's briefing over the 25 km chart with the fleet sheet on the right.
FORM: Extension of an established surface (the M-view chart and the harbor board). No concept seed: the visual world is pinned by DESIGN.md; the three variations vary interaction structure.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md unchanged (design tokens are not rewritten for an unselected variation).
-->

function island(cx, cz, rx, rz, rot, seed) {
  const pts = []; let s = seed;
  const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  for (let i = 0; i < 26; i++) { const a = i / 26 * Math.PI * 2; const w = .78 + rnd() * .44; const px = Math.cos(a) * rx * w, pz = Math.sin(a) * rz * w; const c = Math.cos(rot), sn = Math.sin(rot); pts.push([cx + px * c - pz * sn, cz + px * sn + pz * c]); }
  return pts;
}

}

<div class="rec"><h3>Original recommendation (before the decision): build C as the base, and take two things from B and one from A</h3>
<p><b>Why C.</b> The player this mode is for already plays by selecting a target and pressing a labelled control at the bottom of the screen. C keeps that geometry: the command card sits where the armament strip lives, the compact roster sits where Friendly / Enemy rows already are, and the minimap keeps its corner. Selection, camera follow and direct control are three explicit buttons on the same card, so the transition from “following my ship” to “commanding the fleet” is one press and one glance, not a new screen. It is also the only variation where air control stays visible while a surface ship is selected without opening anything else.</p>

<p><b>Not settled by this study.</b> Exact shortcut assignments (audit above), what the followed-ship scene shows while the map is hidden, label overlap rules for 15 ships and 24 air groups, and how the card behaves with mixed ship + air selections. None of these change the recommended direction.</p></div>
