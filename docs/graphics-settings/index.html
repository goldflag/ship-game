/* Bismarck Sea Trials design system: maritime blue, ivory text, brass commands, mint readiness. */
:root {
  --ivory: #edf1ec; --muted: #bacbd0; --accent: #e0c58d; --maritime: #142d38; --line: #cfdfdf35;
  --field: #0e2530; --field-text: #e1e9e9; --field-hover: #233e48; --field-border: #728b9266;
  --command-ink: #152b32; --command-hover: #efd5a0; --ready: #94d9bf; --alert: #f3b4a7;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 400 14px/1.4 'Barlow', system-ui, sans-serif; color: var(--ivory); background: #132d38; overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:disabled { opacity: .4; cursor: default; }
p { margin: 0; }
:focus { outline: none; }
:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
kbd { font: 400 10px/1.2 'Barlow', sans-serif; display: inline-flex; align-items: center; justify-content: center; min-width: 19px; padding: 2px 4px; border: 1px solid #c0d4d24a; border-radius: 3px; color: #e1e9e8; }
svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

.scene::after { content: ''; position: absolute; inset: 0; background: #04151fc2; }
.scene.battle { filter: saturate(.9) brightness(.9); }

/* Study toolbar: prototype-only controls, kept out of the dialog's language. */
.study { position: fixed; bottom: 12px; left: 12px; z-index: 5; display: flex; align-items: center; gap: 6px; padding: 5px 6px 5px 10px; font-size: 11px; color: var(--muted); background: #0e2530d9; border: 1px solid var(--line); border-radius: 3px; }
.study strong { font-weight: 500; color: var(--ivory); margin-right: 6px; }
.study button { min-height: 26px; padding: 3px 9px; background: transparent; border: 1px solid var(--line); border-radius: 3px; color: var(--muted); }
.study button[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
.study button:hover { color: var(--accent); }

/* Landscape pause-menu settings dialog: 1120 × 640 on desktop, wider than tall. */
.stage { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; }
.settings-dialog { display: flex; flex-direction: column; width: min(1120px, 100%); height: min(640px, 100dvh - 32px); padding: 22px 26px 20px; background: var(--maritime); border: 1px solid #b8cfd14a; border-radius: 4px; box-shadow: 0 25px 90px #0006; }

/* Title row carries the section tabs so the content keeps its height. */
.menu-heading { display: flex; align-items: flex-end; gap: 36px; flex-shrink: 0; border-bottom: 1px solid var(--line); }
.menu-heading h2 { margin: 0 0 10px; font: 500 32px/1.1 'Barlow Condensed', sans-serif; }
.settings-sections { display: flex; gap: 24px; }
.settings-sections button { padding: 12px 0 13px; margin-bottom: -1px; background: transparent; border: 0; border-bottom: 2px solid transparent; color: var(--muted); font-size: 14px; }
.settings-sections button[aria-pressed="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.settings-sections button:hover { color: var(--accent); }
.icon-button { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; margin: 0 -8px 6px auto; padding: 0; background: transparent; border: 0; border-radius: 3px; }
.icon-button:hover { background: #d9eeed1f; }

.settings-content { position: relative; flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #bacbd066 transparent; padding: 0 6px 6px; margin: 0 -6px; }
.settings-description { padding: 14px 0 0; color: var(--muted); font-size: 13px; line-height: 1.5; }

/* Graphics head strip: preset rail on the left, live readout on the right. */
.graphics-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; padding: 14px 0 12px; border-bottom: 1px solid var(--line); }
.preset-block { display: grid; gap: 6px; }
.preset-rail { display: grid; grid-template-columns: repeat(4, 108px); gap: 6px; }
.preset-rail button { min-height: 36px; padding: 6px 10px; background: transparent; border: 1px solid var(--line); border-radius: 3px; color: var(--ivory); font-weight: 500; font-size: 13px; letter-spacing: .01em; transition: border-color 150ms ease-out, color 150ms ease-out, background 150ms ease-out; }
.preset-rail button:hover { background: #d9eeed14; border-color: #d9eeed88; }
.preset-rail button[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); background: #e0c58d12; }
.preset-state { display: flex; gap: 12px; font-size: 12px; color: var(--muted); min-height: 16px; }
.preset-state strong { font-weight: 500; color: var(--accent); }

/* Live readout: an instrument line, not a metric board. */
.readout { display: grid; justify-items: end; gap: 4px; font-variant-numeric: tabular-nums; text-align: right; }
.readout-line { display: flex; align-items: baseline; }
.readout .fps { font: 500 30px/1 'Barlow Condensed', sans-serif; color: var(--ready); min-width: 3ch; text-align: right; transition: color 200ms ease-out; }
.readout .fps.strained, .readout .fps.strained + .unit { color: var(--accent); }
.readout .fps.poor, .readout .fps.poor + .unit { color: var(--alert); }
.readout .unit { font: 500 13px/1 'Barlow Condensed', sans-serif; color: var(--ready); margin: 0 14px 0 5px; letter-spacing: .04em; }
.readout .detail { font-size: 13px; color: var(--muted); }
.readout .detail + .detail::before { content: '·'; margin: 0 8px; color: #bacbd080; }
.readout .note { font-size: 11px; color: #bacbd0b3; }

/* Group columns: each column holds one or two setting groups. */
.settings-columns { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.settings-column { min-width: 0; padding: 0 24px; }
.settings-column:first-child { padding-left: 0; }
.settings-column:last-child { padding-right: 0; }
.settings-column + .settings-column { border-left: 1px solid var(--line); }
.settings-column h3 { margin: 14px 0 0; font: 500 12px/1.3 'Barlow', sans-serif; color: var(--accent); letter-spacing: .02em; }
.settings-column h3 + .setting-row { padding-top: 6px; }

/* Setting rows: label and control on one line, hint beneath. */
.setting-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.setting-row:last-child { border-bottom: 0; }
.setting-row .label { display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 1.3; }
.setting-row .hint { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; font-size: 12px; line-height: 1.4; color: var(--muted); }
.setting-row .control { grid-column: 2; grid-row: 1; }
.setting-row .control .ui-select { width: 146px; }
.setting-row.slider .value { grid-column: 2; grid-row: 1; justify-self: end; font-size: 13px; color: var(--accent); font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
.setting-row.slider input[type="range"] { grid-column: 1 / -1; grid-row: 2; width: 100%; height: 26px; margin: 0; accent-color: var(--accent); cursor: pointer; }
.setting-row.slider input:focus-visible { box-shadow: none; outline: 2px solid var(--accent); outline-offset: 3px; }
.setting-row.pending .label { color: var(--accent); }

/* GPU cost meter: three bars beside the label, read as a cost, not an icon. */
.cost { display: inline-flex; gap: 2px; align-items: flex-end; height: 10px; }
.cost i { width: 4px; background: var(--line); border-radius: 1px; }
.cost i:nth-child(1) { height: 5px; } .cost i:nth-child(2) { height: 7px; } .cost i:nth-child(3) { height: 10px; }
.cost[data-cost="1"] i:nth-child(-n+1), .cost[data-cost="2"] i:nth-child(-n+2), .cost[data-cost="3"] i { background: #bacbd0; }
.tag { font: 500 10px/1.2 'Barlow', sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); border: 1px solid #e0c58d80; border-radius: 2px; padding: 2px 5px; white-space: nowrap; }

/* House select: trigger in the field surface, popover list in the top layer. */
.ui-select { display: inline-flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 36px; padding: 7px 10px; background: var(--field); color: var(--field-text); border: 1px solid var(--field-border); border-radius: 3px; text-align: left; }
.ui-select:hover { background: var(--field-hover); border-color: var(--accent); }
.ui-select[aria-expanded="true"] { border-color: var(--accent); }
.ui-select svg { flex: 0 0 auto; width: 14px; height: 14px; stroke: var(--accent); stroke-width: 1.8; transition: transform 150ms ease-out; }
.ui-select[aria-expanded="true"] svg { transform: rotate(180deg); }
.ui-select-value { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ui-select-menu { position: fixed; z-index: 20; margin: 0; padding: 4px; background: var(--field); color: var(--field-text); border: 1px solid var(--field-border); border-radius: 3px; box-shadow: 0 8px 24px #06172066; }
.ui-select-option { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 36px; padding: 8px; background: transparent; border: 0; text-align: left; }
.ui-select-option[data-active="true"] { background: var(--field-hover); }
.ui-select-option[aria-selected="true"] { color: var(--accent); }
.ui-select-option svg { width: 14px; height: 14px; stroke: var(--accent); stroke-width: 2; }

.ui-button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 7px 16px; background: var(--field); color: var(--field-text); border: 1px solid var(--field-border); border-radius: 3px; white-space: nowrap; }
.ui-button:hover:not(:disabled) { background: var(--field-hover); border-color: var(--accent); }
.ui-input-checkbox { width: 20px; height: 20px; margin: 0; accent-color: var(--accent); }
.link-button { padding: 0; background: none; border: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; font-size: inherit; }
.link-button:hover { color: var(--command-hover); }

/* Footer: live status on the left, section reset and Back on the right. */
.settings-footer { display: flex; align-items: center; gap: 10px; flex-shrink: 0; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.status { flex: 1; min-width: 0; font-size: 13px; line-height: 1.45; color: var(--accent); }
.status.quiet { color: var(--muted); }
.footer-button kbd { margin-left: 4px; }

/* HUD and Sound tabs: two columns, controls left and guidance right. */
.two-columns { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); }
.two-columns > * { min-width: 0; padding: 0 24px; }
.two-columns > :first-child { padding-left: 0; }
.two-columns > :last-child { padding-right: 0; border-left: 1px solid var(--line); }
.note-list { display: grid; gap: 10px; margin-top: 14px; font-size: 12px; line-height: 1.55; color: var(--muted); }
.scale-readout { display: flex; justify-content: space-between; padding: 12px 0 0; font-size: 14px; }
.scale-readout strong { font-weight: 500; color: var(--accent); font-variant-numeric: tabular-nums; }
.hud-preview { position: relative; aspect-ratio: 16 / 9; margin-top: 14px; background: #0f3a5299; border: 1px solid var(--line); border-radius: 2px; overflow: hidden; }
.hud-preview i { position: absolute; border: 1px solid #94d9bfb3; border-radius: 1px; background: #94d9bf14; }
.hud-preview .sight { left: 50%; top: 50%; width: 6px; height: 6px; border-radius: 50%; transform: translate(-50%, -50%); background: transparent; border-color: var(--ivory); }
.hud-preview .caption { position: absolute; left: 8px; top: 6px; font-size: 11px; color: var(--muted); }
.audio-row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 12px; padding: 10px 0 4px; border-bottom: 1px solid var(--line); font-size: 14px; }
.audio-row output { color: var(--accent); font-variant-numeric: tabular-nums; }
.audio-row input[type="range"] { grid-column: 1 / -1; width: 100%; height: 28px; margin: 0; accent-color: var(--accent); cursor: pointer; }
.audio-mute { display: flex; justify-content: space-between; align-items: center; padding: 14px 0 10px; border-bottom: 1px solid var(--line); font-size: 14px; }
.audio-previews { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }

/* Keybindings tab: Helm, Gunnery and View side by side. */
.keybinding-instructions { padding-top: 12px; font-size: 12px; line-height: 1.5; color: var(--muted); }
.keybinding-columns, .keybinding-row { display: grid; grid-template-columns: minmax(0, 1fr) 64px 64px; gap: 6px; align-items: center; }
.keybinding-columns { padding: 6px 0 4px; color: var(--muted); font-size: 11px; }
.keybinding-columns span:not(:first-child) { text-align: center; }
.keybinding-row { min-height: 40px; padding: 3px 0; border-bottom: 1px solid var(--line); font-size: 13px; line-height: 1.25; }
.keybinding-button { min-height: 32px; padding: 4px; border: 1px solid var(--line); border-radius: 3px; background: var(--field); font-size: 12px; }
.keybinding-button > span { color: var(--muted); font-size: 11px; }
.keybinding-button kbd { font-size: 12px; border: 0; padding: 0; }
.keybinding-button:hover { border-color: var(--accent); }
.keybinding-fixed { display: flex; flex-wrap: wrap; gap: 8px 28px; margin-top: 14px; font-size: 13px; }
.keybinding-fixed span { display: inline-flex; align-items: center; gap: 10px; }
.keybinding-fixed small { color: var(--muted); font-size: 11px; }

@media (max-width: 1000px) {
  .settings-dialog { height: auto; max-height: calc(100dvh - 32px); }
  .settings-columns { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .settings-column:nth-child(3) { grid-column: 1 / -1; border-left: 0; padding: 0; }
  .settings-column:nth-child(3) .settings-columns-inner { display: grid; grid-template-columns: 1fr 1fr; gap: 0 48px; }
  .graphics-head { flex-wrap: wrap; }
  .readout { justify-items: start; text-align: left; }
}
@media (max-width: 680px) {
  .settings-dialog { padding: 18px; }
  .menu-heading { flex-wrap: wrap; gap: 4px 20px; }
  .menu-heading h2 { flex: 1; }
  .settings-sections { order: 3; width: 100%; gap: 16px; }
  .settings-sections button { padding: 6px 0 10px; }
  .settings-columns, .two-columns, .settings-column:nth-child(3) .settings-columns-inner { grid-template-columns: minmax(0, 1fr); }
  .settings-column, .two-columns > * { padding: 0; border-left: 0 !important; }
  .preset-rail { grid-template-columns: repeat(2, 1fr); }
  .setting-row { grid-template-columns: minmax(0, 1fr); }
  .setting-row .control { grid-column: 1; grid-row: 3; margin-top: 4px; }
  .setting-row .control .ui-select { width: 100%; }
  .setting-row.slider { grid-template-columns: minmax(0, 1fr) auto; }
  .settings-footer { flex-wrap: wrap; }
  .status { flex-basis: 100%; }
  .study { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<body>
<div class="scene" id="scene"></div>

<div class="study" role="group" aria-label="Study controls">
  <strong>Graphics settings study</strong>
  <button type="button" data-context="port" aria-pressed="true">In port</button>
  <button type="button" data-context="battle" aria-pressed="false">In battle</button>
</div>

<div class="stage">
<section class="settings-dialog" role="dialog" aria-modal="true" aria-labelledby="settings-title">
  <div class="menu-heading">
    <h2 id="settings-title">Settings</h2>
    <div class="settings-sections" role="group" aria-label="Settings sections" id="tabs">
      <button type="button" data-tab="graphics" aria-pressed="true">Graphics</button>
      <button type="button" data-tab="hud" aria-pressed="false">HUD</button>
      <button type="button" data-tab="keys" aria-pressed="false">Keybindings</button>
      <button type="button" data-tab="sound" aria-pressed="false">Sound</button>
    </div>
    <button type="button" class="icon-button" aria-label="Close settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
  </div>

  <div class="settings-content" id="content"></div>

  <footer class="settings-footer">
    <div class="status quiet" id="status" role="status" aria-live="polite"></div>
    <button type="button" class="ui-button" id="reset"></button>
    <button type="button" class="ui-button footer-button">Back to menu <kbd>Esc</kbd></button>
  </footer>
</section>
</div>

<script>
(() => {
  // Rows and options mirror the proposed GraphicsSettings schema in README.md.
  const ROWS = [
    { column: 0, group: 'Display', id: 'renderScale', label: 'Render scale', kind: 'slider', min: 50, max: 100, step: 5, cost: 3,
      hint: 'Resolution of the sea and ships. Instruments and menus stay sharp.' },
    { column: 0, group: 'Display', id: 'frameLimit', label: 'Frame rate limit', options: [['display', 'Display refresh'], ['120', '120 FPS'], ['60', '60 FPS'], ['30', '30 FPS']],
      hint: 'Caps rendering to save power and keep fans quiet.' },
    { column: 0, group: 'Display', id: 'antialiasing', label: 'Anti-aliasing', cost: 1, options: [['off', 'Off'], ['fxaa', 'FXAA'], ['smaa', 'SMAA']],
      hint: 'Smooths rigging, rails and hull edges. SMAA is sharper and costs a little more.' },
    { column: 1, group: 'Sea and sky', id: 'ocean', label: 'Ocean simulation', cost: 2, later: true, options: [['low', 'Low'], ['medium', 'Medium'], ['high', 'High'], ['ultra', 'Ultra']],
      hint: 'Wave cascades, surface mesh and wake resolution.' },
    { column: 1, group: 'Sea and sky', id: 'reflections', label: 'Water reflections', cost: 3, options: [['sky', 'Sky only'], ['scene', 'Ships and sky']],
      hint: 'Ships and sky traces hulls and smoke into the water. The heaviest single effect in a large fleet.' },
    { column: 1, group: 'Sea and sky', id: 'clouds', label: 'Clouds', cost: 3, options: [['low', 'Low'], ['medium', 'Medium'], ['high', 'High'], ['ultra', 'Ultra']],
      hint: 'Volumetric cloud detail and cloud light in reflections. Ultra adds sun shafts.' },
    { column: 1, group: 'Sea and sky', id: 'shadows', label: 'Shadows', cost: 2, options: [['off', 'Off'], ['low', 'Low'], ['medium', 'Medium'], ['high', 'High']],
      hint: 'Sun shadows across decks, hulls and the harbor.' },
    { column: 2, group: 'Detail and effects', id: 'modelDetail', label: 'Ship and aircraft detail', cost: 1, options: [['low', 'Low'], ['medium', 'Medium'], ['high', 'High'], ['full', 'Full']],
      hint: 'How close a hull or airframe must be before it keeps its full geometry.' },
    { column: 2, group: 'Detail and effects', id: 'terrain', label: 'Terrain and vegetation', cost: 1, later: true, options: [['medium', 'Medium'], ['high', 'High']],
      hint: 'Island and harbor mesh density and tree cover.' },
    { column: 2, group: 'Detail and effects', id: 'effects', label: 'Combat effects', cost: 2, options: [['low', 'Low'], ['medium', 'Medium'], ['high', 'High']],
      hint: 'Gun smoke, splashes, fires, funnel smoke and damage marks.' },
    { column: 2, group: 'Readouts', id: 'readout', label: 'Performance readout', options: [['hidden', 'Hidden'], ['fps', 'FPS'], ['detailed', 'Detailed']],
      hint: 'Detailed adds frame time, render resolution and draw counts beside the pause control.' },
  ];
  const PRESETS = {
    low:    { renderScale: 75,  frameLimit: 'display', antialiasing: 'fxaa', ocean: 'low',    reflections: 'sky',   clouds: 'low',    shadows: 'off',    modelDetail: 'low',    terrain: 'medium', effects: 'low',    readout: 'fps' },
    medium: { renderScale: 100, frameLimit: 'display', antialiasing: 'fxaa', ocean: 'medium', reflections: 'sky',   clouds: 'medium', shadows: 'low',    modelDetail: 'medium', terrain: 'medium', effects: 'medium', readout: 'fps' },
    high:   { renderScale: 100, frameLimit: 'display', antialiasing: 'fxaa', ocean: 'high',   reflections: 'scene', clouds: 'medium', shadows: 'medium', modelDetail: 'high',   terrain: 'high',   effects: 'high',   readout: 'fps' },
    ultra:  { renderScale: 100, frameLimit: 'display', antialiasing: 'smaa', ocean: 'ultra',  reflections: 'scene', clouds: 'high',   shadows: 'high',   modelDetail: 'full',   terrain: 'high',   effects: 'high',   readout: 'fps' },
  };
  const PRESET_LABEL = { low: 'Low', medium: 'Medium', high: 'High', ultra: 'Ultra' };
  const PRESET_NOTES = { low: 'For integrated graphics and laptops on battery.', medium: 'Balanced for mid-range and older desktop GPUs.', high: 'Recommended for most desktop GPUs.', ultra: 'For fast GPUs; the full ocean and sky simulation.' };

  // Illustrative frame-rate model for the study. The real dialog reads renderer telemetry.
  const COST = {
    pixel: { reflections: { sky: 0, scene: .28 }, clouds: { low: -.12, medium: 0, high: .22, ultra: .48 }, antialiasing: { off: -.03, fxaa: 0, smaa: .05 } },
    frame: { ocean: { low: -.08, medium: -.04, high: 0, ultra: .12 }, shadows: { off: -.08, low: -.04, medium: 0, high: .1 },
      modelDetail: { low: -.05, medium: -.02, high: 0, full: .06 }, terrain: { medium: -.01, high: 0 }, effects: { low: -.03, medium: -.015, high: 0 } },
  };
  const CONTEXT = { port: { base: 91, note: 'Measured in port. A busy fleet action runs lower.' }, battle: { base: 56, note: 'Measured in battle, 30 ships and four carriers.' } };
  const CSS = { width: 1600, height: 900, dpr: 2, cap: 1.5 };

  // Other tabs, reproduced from the current dialog so the wide layout can be judged as a whole.
  const ACTIONS = [
    ['Helm', [['Raise engine order', 'KeyW', 'ArrowUp'], ['Lower engine order', 'KeyS', 'ArrowDown'], ['Steer port', 'KeyA', 'ArrowLeft'], ['Steer starboard', 'KeyD', 'ArrowRight'], ['Stop engine', 'Space', null], ['Submarine: order surface', 'KeyU', null], ['Submarine: order 50 m depth', 'KeyJ', null], ['Dive 2 m deeper', 'KeyZ', null], ['Rise 2 m', 'KeyX', null], ['Emergency blow ballast', 'KeyB', null]]],
    ['Gunnery', [['Fire selected battery', 'KeyQ', null], ...Array.from({ length: 10 }, (_, i) => [`Select weapon group ${i + 1}`, `Digit${(i + 1) % 10}`, null]), ['Switch AP / HE shells', 'KeyE', null], ['Toggle shell follow camera', 'KeyT', null]]],
    ['View', [['Raise / lower periscope view', 'KeyP', null], ['Cycle camera', 'KeyC', null], ['Recenter camera', 'KeyR', null], ['Show / hide instruments', 'KeyH', null], ['Toggle fullscreen', 'KeyF', null], ['Increase minimap size', 'Equal', 'NumpadAdd'], ['Decrease minimap size', 'Minus', 'NumpadSubtract'], ['Open / close air operations map', 'KeyM', null]]],
  ];
  const KEY_NAMES = { ArrowUp: 'Up', ArrowDown: 'Down', ArrowLeft: 'Left', ArrowRight: 'Right', Space: 'Space', Equal: '=', Minus: '-', NumpadAdd: 'Num +', NumpadSubtract: 'Num -' };
  const keyLabel = code => KEY_NAMES[code] || code.replace(/^Key|^Digit/, '');

  const state = { ...PRESETS.high };
  const applied = { ocean: state.ocean, terrain: state.terrain }; // What the loaded scene is running.
  const hud = { mode: 'auto', scale: 100 };
  const audio = { muted: false, master: 80, effects: 100, interface: 70 };
  let context = 'port';
  let tab = 'graphics';
  let statusTimer = 0;

  const content = document.getElementById('content');
  const byId = {};
  const svgChevron = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
  const svgCheck = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>';

  function costMeter(cost) {
    if (!cost) return '';
    const words = ['', 'light', 'moderate', 'heavy'];
    return `<span class="cost" data-cost="${cost}" role="img" aria-label="GPU cost: ${words[cost]}" title="GPU cost: ${words[cost]}"><i></i><i></i><i></i></span>`;
  }
  const laterTag = () => `<span class="tag" data-tag>${context === 'port' ? 'Next battle' : 'After battle'}</span>`;

  function rowMarkup(row) {
    if (row.kind === 'slider') return `<div class="setting-row slider" data-row="${row.id}">
      <div class="label"><label for="${row.id}">${row.label}</label>${costMeter(row.cost)}</div>
      <output class="value" for="${row.id}" id="${row.id}-value"></output>
      <input id="${row.id}" type="range" min="${row.min}" max="${row.max}" step="${row.step}" value="${state[row.id]}">
      <p class="hint">${row.hint}</p></div>`;
    return `<div class="setting-row" data-row="${row.id}">
      <div class="label"><span id="${row.id}-label">${row.label}</span>${costMeter(row.cost)}</div>
      <p class="hint">${row.later ? laterTag() : ''}<span>${row.hint}</span></p>
      <div class="control"><button type="button" class="ui-select" id="${row.id}" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="${row.id}-label"><span class="ui-select-value"></span>${svgChevron}</button></div></div>`;
  }

  function buildGraphics() {
    const columns = [[], [], []];
    for (const row of ROWS) {
      const column = columns[row.column];
      if (column.at(-1)?.group !== row.group) column.push({ group: row.group, rows: [] });
      column.at(-1).rows.push(row);
    }
    content.innerHTML = `<section aria-label="Graphics settings">
      <div class="graphics-head">
        <div class="preset-block">
          <div class="preset-rail" role="group" aria-label="Quality preset" id="presets">${Object.keys(PRESETS).map(name => `<button type="button" data-preset="${name}" aria-pressed="false">${PRESET_LABEL[name]}</button>`).join('')}</div>
          <div class="preset-state" id="preset-state"></div>
        </div>
        <div class="readout" role="status" aria-live="off" id="live-readout">
          <div class="readout-line"><span class="fps" id="fps">91</span><span class="unit">FPS</span><span class="detail" id="frame-ms">11.0 ms</span><span class="detail" id="render-size"></span><span class="detail" id="backend">WebGPU · Apple</span></div>
          <span class="note" id="readout-note"></span>
        </div>
      </div>
      <div class="settings-columns">${columns.map(groups => `<div class="settings-column"><div class="settings-columns-inner">${groups.map(({ group, rows }) => `<div><h3>${group}</h3>${rows.map(rowMarkup).join('')}</div>`).join('')}</div></div>`).join('')}</div>
    </section>`;
    for (const row of ROWS) {
      byId[row.id] = document.getElementById(row.id);
      if (row.kind === 'slider') byId[row.id].addEventListener('input', () => change(row, Number(byId[row.id].value)));
      else byId[row.id].addEventListener('click', () => openMenu(row));
    }
    document.getElementById('presets').addEventListener('click', event => {
      const button = event.target.closest('button[data-preset]');
      if (!button) return;
      Object.assign(state, PRESETS[button.dataset.preset]);
      render();
      renderStatus(`${button.textContent} preset applied.`);
    });
    render();
  }

  function buildHud() {
    const automatic = Math.max(.75, Math.min(2, CSS.width / 1920, CSS.height / 1080));
    const current = () => Math.round((hud.mode === 'auto' ? automatic : 1) * hud.scale);
    content.innerHTML = `<section aria-label="HUD settings" class="two-columns">
      <div>
        <p class="settings-description">Size the battle instruments to suit your display. Changes apply immediately, including during a battle.</p>
        <div class="setting-row" style="margin-top:6px">
          <div class="label"><span id="hud-mode-label">HUD scaling</span></div>
          <p class="hint"><span id="hud-mode-hint"></span></p>
          <div class="control"><button type="button" class="ui-select" id="hud-mode" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="hud-mode-label"><span class="ui-select-value"></span>${svgChevron}</button></div>
        </div>
        <div class="setting-row slider">
          <div class="label"><label for="hud-size" id="hud-size-label"></label></div>
          <output class="value" for="hud-size" id="hud-size-value"></output>
          <input id="hud-size" type="range" min="50" max="200" step="5" value="${hud.scale}">
          <p class="hint">Scales instruments, the minimap, ship names and hit readouts. Menus keep their normal size.</p>
        </div>
        <p class="scale-readout">Current HUD scale <strong id="hud-current"></strong></p>
      </div>
      <div>
        <p class="settings-description">Preview at this window size.</p>
        <div class="hud-preview" aria-hidden="true" id="hud-preview"><span class="caption">1600 × 900</span><i class="sight"></i><i id="pv-helm"></i><i id="pv-arms"></i><i id="pv-map"></i></div>
        <div class="note-list"><p>The automatic size fits a 1080p workspace and follows the window as you resize it or move between displays.</p><p>HUD settings are saved in this browser.</p></div>
      </div>
    </section>`;
    const HUD_MODES = { options: [['auto', 'Automatic'], ['manual', 'Manual']], id: 'hud-mode', label: 'HUD scaling', custom: value => { hud.mode = value; paint(); } };
    byId['hud-mode'] = document.getElementById('hud-mode');
    byId['hud-mode'].addEventListener('click', () => openMenu(HUD_MODES, () => hud.mode));
    document.getElementById('hud-size').addEventListener('input', event => { hud.scale = Number(event.target.value); paint(); });
    function paint() {
      byId['hud-mode'].querySelector('.ui-select-value').textContent = hud.mode === 'auto' ? 'Automatic' : 'Manual';
      document.getElementById('hud-mode-hint').textContent = hud.mode === 'auto' ? 'Adapts to your game window. Adjust the automatic size below.' : 'Keeps your chosen size when you resize the game window or move between displays.';
      document.getElementById('hud-size-label').textContent = hud.mode === 'auto' ? 'Size adjustment' : 'HUD size';
      document.getElementById('hud-size-value').textContent = `${hud.scale}%`;
      document.getElementById('hud-current').textContent = `${current()}%`;
      const s = current() / 100, box = document.getElementById('hud-preview'), w = box.clientWidth, h = box.clientHeight;
      const set = (id, x, y, bw, bh) => { const n = document.getElementById(id); n.style.left = `${x}px`; n.style.top = `${y}px`; n.style.width = `${bw}px`; n.style.height = `${bh}px`; };
      const edge = .015 * w;
      set('pv-helm', edge, h - edge - .12 * w * s, .15 * w * s, .12 * w * s);
      set('pv-arms', w / 2 - .105 * w * s, h - edge - .05 * w * s, .21 * w * s, .05 * w * s);
      set('pv-map', w - .2 * w * s, h - .2 * w * s, .2 * w * s, .2 * w * s);
      document.getElementById('reset').textContent = 'Reset HUD to automatic';
      document.getElementById('reset').disabled = hud.mode === 'auto' && hud.scale === 100;
    }
    paint();
    requestAnimationFrame(paint);
    renderStatus();
  }

  function buildSound() {
    content.innerHTML = `<section aria-label="Sound settings" class="two-columns">
      <div>
        <p class="settings-description">Balance the guns and instruments. Changes apply immediately.</p>
        <label class="audio-mute">Mute all sound<input class="ui-input-checkbox" type="checkbox" id="audio-muted" ${audio.muted ? 'checked' : ''}></label>
        ${[['master', 'Master volume'], ['effects', 'Guns & impacts'], ['interface', 'Controls & instruments']].map(([key, label]) => `<label class="audio-row" for="audio-${key}"><span>${label}</span><output id="audio-${key}-value">${audio[key]}%</output><input id="audio-${key}" data-key="${key}" type="range" min="0" max="100" step="1" value="${audio[key]}" aria-label="${label}"></label>`).join('')}
      </div>
      <div>
        <p class="settings-description">Preview sounds at the current levels.</p>
        <div class="audio-previews" role="group" aria-label="Preview sounds"><button type="button" class="ui-button" id="test-controls">Test controls</button><button type="button" class="ui-button" id="test-gunfire">Test gunfire</button></div>
        <div class="note-list"><p>Guns & impacts covers main batteries, shell splashes, torpedo launches and hits. Controls & instruments covers menu clicks, the telegraph and alarms.</p><p>Sound settings are saved in this browser. Background tabs are silent.</p></div>
      </div>
    </section>`;
    const paint = () => {
      for (const key of ['master', 'effects', 'interface']) document.getElementById(`audio-${key}-value`).textContent = `${audio[key]}%`;
      document.getElementById('test-controls').disabled = audio.muted || audio.master === 0 || audio.interface === 0;
      document.getElementById('test-gunfire').disabled = audio.muted || audio.master === 0 || audio.effects === 0;
      document.getElementById('reset').textContent = 'Reset sound to defaults';
      document.getElementById('reset').disabled = !audio.muted && audio.master === 80 && audio.effects === 100 && audio.interface === 70;
    };
    document.getElementById('audio-muted').addEventListener('change', event => { audio.muted = event.target.checked; paint(); });
    for (const input of content.querySelectorAll('input[type="range"]')) input.addEventListener('input', () => { audio[input.dataset.key] = Number(input.value); paint(); });
    paint();
    renderStatus();
  }

  function buildKeys() {
    content.innerHTML = `<section aria-label="Keybindings">
      <p class="keybinding-instructions">Select a binding, then press a key. Esc cancels a change. Delete clears a binding. Keep at least one key per action. Esc, Tab and Enter stay reserved for menus.</p>
      <div class="settings-columns">${ACTIONS.map(([group, rows]) => `<div class="settings-column"><h3>${group}</h3>
        <div class="keybinding-columns" aria-hidden="true"><span>Action</span><span>Primary</span><span>Alternate</span></div>
        ${rows.map(([label, primary, alternate]) => `<div class="keybinding-row"><span>${label}</span>${[primary, alternate].map((code, slot) => `<button type="button" class="keybinding-button" aria-label="${label}, ${slot ? 'alternate' : 'primary'}: ${code ? keyLabel(code) : 'unbound'}">${code ? `<kbd>${keyLabel(code)}</kbd>` : '<span>Unbound</span>'}</button>`).join('')}</div>`).join('')}
      </div>`).join('')}</div>
      <div class="keybinding-fixed"><span>Pause / resume <kbd>Esc</kbd> <small>Always available</small></span><span>Toggle binoculars <kbd>Shift</kbd> <small>Fixed control</small></span><span>Hold for cursor <kbd>Ctrl</kbd> <small>Fixed control</small></span><span><small>Move the mouse to aim; hold left mouse to fire. Right mouse also toggles binoculars. Scroll adjusts camera distance or magnification.</small></span></div>
    </section>`;
    document.getElementById('reset').textContent = 'Reset keybindings to defaults';
    document.getElementById('reset').disabled = false;
    renderStatus();
  }

  function optionLabel(row, value) { return (row.options.find(([v]) => v === value) || [])[1] || value; }

  function renderSize() {
    const ratio = Math.min(CSS.dpr, CSS.cap) * state.renderScale / 100;
    return `${Math.round(CSS.width * ratio)} × ${Math.round(CSS.height * ratio)}`;
  }
  const matchingPreset = () => Object.keys(PRESETS).find(name => Object.keys(PRESETS[name]).every(key => PRESETS[name][key] === state[key])) || null;
  function nearestPreset() {
    let best = 'high', score = -1;
    for (const name of Object.keys(PRESETS)) {
      const n = Object.keys(PRESETS[name]).filter(key => PRESETS[name][key] === state[key]).length;
      if (n > score) { score = n; best = name; }
    }
    return best;
  }

  function modelFps() {
    const s = state.renderScale / 100;
    let pixel = 1;
    for (const key of Object.keys(COST.pixel)) pixel += COST.pixel[key][state[key]];
    let frame = 1;
    for (const key of Object.keys(COST.frame)) frame += COST.frame[key][state[key]];
    let fps = CONTEXT[context].base / (0.32 * frame + 0.68 * s * s * pixel);
    if (state.frameLimit !== 'display') fps = Math.min(fps, Number(state.frameLimit));
    return fps;
  }
  let shown = 91;
  function tickReadout() {
    if (tab !== 'graphics') return;
    const target = modelFps();
    const jitter = state.frameLimit === 'display' ? (Math.random() - .5) * 2.4 : (Math.random() - .5) * .6;
    shown += (target + jitter - shown) * .35;
    const value = Math.max(1, Math.round(shown));
    const fps = document.getElementById('fps');
    fps.textContent = value;
    fps.className = 'fps' + (value < 30 ? ' poor' : value < 50 ? ' strained' : '');
    document.getElementById('frame-ms').textContent = `${(1000 / Math.max(1, shown)).toFixed(1)} ms`;
  }

  function render() {
    if (tab !== 'graphics') return;
    for (const row of ROWS) {
      const node = byId[row.id];
      const wrapper = node.closest('.setting-row');
      if (row.kind === 'slider') {
        node.value = state[row.id];
        document.getElementById(`${row.id}-value`).textContent = `${state[row.id]}% · ${renderSize()}`;
        node.setAttribute('aria-valuetext', `${state[row.id]} percent, ${renderSize()} pixels`);
      } else {
        node.querySelector('.ui-select-value').textContent = optionLabel(row, state[row.id]);
        if (row.later) {
          wrapper.classList.toggle('pending', applied[row.id] !== state[row.id]);
          wrapper.querySelector('[data-tag]').textContent = context === 'port' ? 'Next battle' : 'After battle';
        }
      }
    }
    const preset = matchingPreset();
    for (const button of document.querySelectorAll('#presets button')) button.setAttribute('aria-pressed', String(button.dataset.preset === preset));
    document.getElementById('preset-state').innerHTML = preset
      ? `<span>${PRESET_NOTES[preset]}</span>`
      : `<span><strong>Custom</strong> · from ${PRESET_LABEL[nearestPreset()]}.</span><span>Your own mix of settings.</span>`;
    document.getElementById('render-size').textContent = renderSize();
    document.getElementById('readout-note').textContent = CONTEXT[context].note;
    document.getElementById('reset').textContent = 'Reset graphics to High';
    document.getElementById('reset').disabled = preset === 'high';
    renderStatus();
  }

  const pendingRows = () => ROWS.filter(row => row.later && applied[row.id] !== state[row.id]);
  const DEFAULT_STATUS = {
    graphics: 'Changes apply immediately and are saved in this browser.',
    hud: 'HUD settings apply immediately, including during a battle.',
    sound: 'Sound settings apply immediately.',
    keys: 'Weapon groups follow the HUD order for each ship: main guns, secondaries, torpedoes, then depth charges. Bindings are saved in this browser.',
  };
  function renderStatus(message) {
    const status = document.getElementById('status');
    clearTimeout(statusTimer);
    if (message) {
      status.className = 'status'; status.textContent = message;
      statusTimer = setTimeout(() => renderStatus(), 2200);
      return;
    }
    const pending = tab === 'graphics' ? pendingRows() : [];
    if (pending.length) {
      const names = pending.map(row => `${row.label}: ${optionLabel(row, state[row.id])}`).join(' and ');
      status.className = 'status';
      status.innerHTML = context === 'port'
        ? `${names} applies when the next battle starts. <button type="button" class="link-button" id="reload-now">Reload port to apply now</button>`
        : `${names} applies when you return to port.`;
      const reload = document.getElementById('reload-now');
      if (reload) reload.addEventListener('click', () => { for (const row of pending) applied[row.id] = state[row.id]; render(); renderStatus('Port reloaded with the new ocean and terrain.'); });
      return;
    }
    status.className = 'status quiet';
    status.textContent = DEFAULT_STATUS[tab];
  }

  function change(row, value) {
    state[row.id] = value;
    render();
    if (row.later) return; // The pending notice already explains itself.
    const label = row.kind === 'slider' ? `${value}%` : optionLabel(row, value);
    renderStatus(row.id === 'frameLimit' && value === 'display' ? 'Frame rate limit removed.' : `${row.label} set to ${label}.`);
  }

  // Select-only combobox: focus stays on the trigger; the list opens in a fixed layer.
  let openRow = null, menu = null, active = -1, current = null;
  function openMenu(row, read) {
    if (openRow === row) { closeMenu(); return; }
    closeMenu();
    openRow = row; current = read || (() => state[row.id]);
    const trigger = byId[row.id];
    trigger.setAttribute('aria-expanded', 'true');
    menu = document.createElement('div');
    menu.className = 'ui-select-menu'; menu.setAttribute('role', 'listbox'); menu.id = `${row.id}-options`;
    active = Math.max(0, row.options.findIndex(([v]) => v === current()));
    menu.innerHTML = row.options.map(([v, label], i) => `<button type="button" class="ui-select-option" role="option" data-value="${v}" aria-selected="${v === current()}" data-active="${i === active}">${label}${v === current() ? svgCheck : ''}</button>`).join('');
    document.body.appendChild(menu);
    const rect = trigger.getBoundingClientRect();
    const width = Math.max(rect.width, 160);
    menu.style.width = `${width}px`;
    menu.style.left = `${Math.max(8, Math.min(rect.right - width, window.innerWidth - width - 8))}px`;
    const below = rect.bottom + 4;
    menu.style.top = `${below + menu.offsetHeight > window.innerHeight - 8 ? rect.top - menu.offsetHeight - 4 : below}px`;
    menu.addEventListener('mousemove', event => { const option = event.target.closest('.ui-select-option'); if (option) setActive([...menu.children].indexOf(option)); });
    menu.addEventListener('click', event => { const option = event.target.closest('.ui-select-option'); if (option) choose(option.dataset.value); });
    trigger.focus({ preventScroll: true });
  }
  function choose(value) {
    const row = openRow;
    closeMenu();
    if (row.custom) row.custom(value); else change(row, value);
  }
  function setActive(index) { active = index; [...menu.children].forEach((child, i) => child.dataset.active = String(i === index)); }
  function closeMenu() {
    if (!openRow) return;
    byId[openRow.id].setAttribute('aria-expanded', 'false');
    menu.remove(); menu = null; openRow = null;
  }
  document.addEventListener('pointerdown', event => { if (openRow && !menu.contains(event.target) && !byId[openRow.id].contains(event.target)) closeMenu(); });
  document.addEventListener('keydown', event => {
    if (!openRow) return;
    const count = openRow.options.length;
    if (event.key === 'ArrowDown') { event.preventDefault(); setActive((active + 1) % count); }
    else if (event.key === 'ArrowUp') { event.preventDefault(); setActive((active - 1 + count) % count); }
    else if (event.key === 'Home') { event.preventDefault(); setActive(0); }
    else if (event.key === 'End') { event.preventDefault(); setActive(count - 1); }
    else if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); choose(openRow.options[active][0]); }
    else if (event.key === 'Escape' || event.key === 'Tab') { closeMenu(); }
  });
  content.addEventListener('scroll', closeMenu);
  window.addEventListener('resize', closeMenu);

  document.getElementById('reset').addEventListener('click', () => {
    if (tab === 'graphics') { Object.assign(state, PRESETS.high); render(); renderStatus('Graphics reset to High.'); }
    else if (tab === 'hud') { hud.mode = 'auto'; hud.scale = 100; buildHud(); renderStatus('HUD reset to automatic.'); }
    else if (tab === 'sound') { Object.assign(audio, { muted: false, master: 80, effects: 100, interface: 70 }); buildSound(); renderStatus('Sound reset to defaults.'); }
    else renderStatus('Default keybindings restored.');
  });

  function showTab(next) {
    closeMenu();
    tab = next;
    for (const button of document.querySelectorAll('#tabs button')) button.setAttribute('aria-pressed', String(button.dataset.tab === next));
    content.scrollTop = 0;
    ({ graphics: buildGraphics, hud: buildHud, sound: buildSound, keys: buildKeys })[next]();
  }
  document.getElementById('tabs').addEventListener('click', event => { const button = event.target.closest('button[data-tab]'); if (button) showTab(button.dataset.tab); });

  function setContext(next) {
    context = next;
    document.getElementById('scene').classList.toggle('battle', next === 'battle');
    for (const button of document.querySelectorAll('.study button[data-context]')) button.setAttribute('aria-pressed', String(button.dataset.context === next));
    if (tab === 'graphics') render(); else renderStatus();
  }
  document.querySelector('.study').addEventListener('click', event => {
    const button = event.target.closest('button[data-context]');
    if (button) { setContext(button.dataset.context); location.hash = button.dataset.context; }
  });

  // Review states: #battle,pending or ?s=battle,pending; also low, ultra, custom, menu, hud, keys, sound.
  function applyHash() {
    const query = new URLSearchParams(location.search).get('s') || '';
    const options = new Set(`${query},${location.hash.replace('#', '')}`.split(/[&,]/).filter(Boolean));
    Object.assign(state, PRESETS.high); applied.ocean = 'high'; applied.terrain = 'high';
    if (options.has('low')) Object.assign(state, PRESETS.low);
    if (options.has('ultra')) Object.assign(state, PRESETS.ultra);
    if (options.has('custom')) { state.reflections = 'sky'; state.shadows = 'high'; state.renderScale = 80; }
    if (options.has('pending')) state.ocean = 'ultra';
    showTab(options.has('hud') ? 'hud' : options.has('keys') ? 'keys' : options.has('sound') ? 'sound' : 'graphics');
    setContext(options.has('battle') ? 'battle' : 'port');
    if (options.has('menu') && tab === 'graphics') openMenu(ROWS.find(row => row.id === 'clouds'));
  }
  window.addEventListener('hashchange', applyHash);

  applyHash();
  shown = modelFps();
  tickReadout();
  setInterval(tickReadout, 500);
})();
</script>
</body>
</html>
